name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The workflow-wide floor. Every job below narrows it again rather than
# inheriting it, because a job that states nothing is a job whose token nobody
# reviewed when the next one was added.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}

jobs:
  linux:
    name: Linux gate
    runs-on: ubuntu-24.04
    # ⚠ THE BUDGET USED TO BE SPENT ALMOST ENTIRELY BY *Workflow acceptance*, and
    # that step now has a job of its own below. Measured on run 83, the last one
    # that carried both: the lane took 30.5 minutes and 25.9 of them were that one
    # step, with *Repository gate* at 3.5 and everything else together under one.
    # ⛔ A lane that runs out of time reports as infrastructure rather than as a
    # defect, and reads as a flake nobody root-causes, so the headroom stays
    # generous relative to what is left here.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      # Two caches rather than one, because they want different keys. Downloaded
      # crates are inert bytes and a near-miss is still useful, so that one falls
      # back. Build artifacts are not: restoring a target directory built against
      # a different dependency set is how a stale artifact survives a lockfile
      # change, so that one is exact-match or nothing.
      - name: Cache downloaded crates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-crates-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-crates-
      - name: Cache build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Host report
        run: sh scripts/doctor/doctor.sh --fast
      - name: Install pinned shfmt
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.0
      - name: Shell syntax and style
        # Every tracked shell script, found rather than listed. A glob per
        # directory is a list, and ACQ-02 added a directory the list did not
        # have, so the new script would have gone unchecked on the lane that is
        # meant to check it.
        # ⛔ EACH CHECK'S STATUS IS KEPT, AND BOTH RUN. On two bare lines, the
        # runner's `bash -e` ended the block at a shellcheck finding before
        # shfmt's diff was printed, and `check-workflow`'s `sh -c` answered a
        # finding only shellcheck makes with shfmt's exit 0. Found on
        # 2026-10-14 by the door sweep of the change that fixed the same shape
        # in `capture-client.yml`.
        run: |
          rc=0
          find scripts -name '*.sh' -print0 | xargs -0 shellcheck || rc=$?
          find scripts -name '*.sh' -print0 | xargs -0 shfmt -d -i 2 -ci || rc=$?
          exit "$rc"
      # ⛔ ITS OWN STEP RATHER THAN A GATE ROW, AND THE REASON IS MEASURED.
      # `check-defaults` runs five checks under six environments, which is 28
      # seconds - free beside a concurrent gate and NOT free inside
      # `check-workflow`, which runs the whole gate about ten times. As a gate
      # row it pushed that job from about 20 minutes to past its 30-minute bound
      # and the job was cancelled at 30m15s. `check-workflow` is kept out of the
      # gate for a related reason and this is the second member of that class.
      - name: Runner-default sweep
        run: sh scripts/ci/check-defaults.sh
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust check
        run: cargo check --workspace --locked --all-targets
      - name: Rust tests
        run: cargo test --workspace --locked --all-targets
      - name: Rust lints
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      # ⭐ THE GO MODULE GETS WHAT THE RUST WORKSPACE GETS, `CI-10`. Nothing ran
      # either over `tools/check` before 2026-10-11, so the checking layer was
      # the one language this lane neither formatted nor linted.
      # ⚠ EVERY LINE ENDS IN ITS OWN VERDICT. GitHub runs this as `bash -e` and
      # `check-workflow` runs it as `sh -c`, which stops at nothing, so a status
      # left to the shell's options is a status one of the two never reads.
      # ⚠ LINUX ONLY, ON PURPOSE. gofmt answers about bytes, and a checkout that
      # converted line endings would make it list every file.
      - name: Go formatting and vet
        run: |
          unformatted=$(gofmt -l tools/check) || exit 1
          if [ -n "$unformatted" ]; then printf 'gofmt would rewrite:\n%s\n' "$unformatted"; exit 1; fi
          cd tools/check && go vet ./...
      - name: Repository gate
        run: sh scripts/common/check-gate.sh --strict
      # ⛔ THE HARNESS CASES ARE NOT IN THE GATE, AND WERE RUN BY NOTHING. Each
      # builds its Rust subject cold, measured at 25 seconds of gate, which
      # `check-workflow` would pay about nine times per shard; so a weakened
      # `check-cache` rule passed every row CI ran. Measured on 2026-10-11 by
      # planting exactly that. This step is where they run, once.
      - name: Checking harnesses
        run: |
          set -eu
          (cd tools/check && go build -o "$RUNNER_TEMP/bit-check" .)
          "$RUNNER_TEMP/bit-check" check-bitcheck --harnesses

  # ⭐ A JOB OF ITS OWN, BECAUSE IT WAS THE LANE. It plants a defect of each class
  # the gate exists to catch and runs the offending step against it, and several
  # of those cases run the whole gate - nine times in total - so it costs more
  # than everything else in this workflow put together. Measured on run 83: 25.9
  # minutes of a 30.5-minute lane. ⛔ Serialising it behind the Linux gate bought
  # nothing: it repeats that gate itself, so a tree it would reject is one the
  # first case reports with its own message.
  #
  # ⚠ IT IS DELIBERATELY ABSENT FROM check-gate.sh, and that is unchanged: a
  # runner inside the gate that also runs the gate recurses.
  #
  # ⚠ THE SETUP IS REPEATED RATHER THAN SHARED. A minute of checkout and cache
  # restore on a job that saves a quarter of an hour is a trade worth naming
  # rather than hiding behind a composite action nothing else would use.
  acceptance:
    name: Workflow acceptance ${{ matrix.shard }}/5
    runs-on: ubuntu-24.04
    # ⭐ SHARDED ACROSS FOUR RUNNERS, `CI-10`, 2026-09-10. This job was 32.6
    # minutes on run 122 - measured, not estimated - against 5.8 for the Linux
    # gate and 2.9 for the Windows one, so it WAS the CI wall clock on its own.
    # `check-workflow` runs the whole repository gate about nine times, and a
    # 130-second gate is about twenty minutes of that whatever language its rows
    # are written in. ⛔ Nothing inside the harness touches that number; only
    # running the units on more than one machine does.
    #
    # ⛔ THE PARTITION IS CHECKED RATHER THAN ASSUMED. `index mod N` is provable by
    # construction, each shard prints what it ran and what it skipped, and
    # `scripts/ci/check-shards.sh` asserts that the N shards together cover every
    # unit exactly once for every N from 1 to 6. ⚠ A shard selector that silently
    # claimed no unit would report a faster green run over less work, which is
    # this repository's oldest defect class and the one a wall-clock target makes
    # most tempting.
    #
    # ⛔ AND EVERY SHARD RUNS THE CONTROLS. A shard carrying only plants goes
    # GREEN over a tree where every step is broken, because a plant that is
    # refused proves nothing unless the clean tree is accepted. That is a floor on
    # what a shard can cost and it is paid on purpose.
    #
    # ⚠ THE COUNT IS HERE AND IN THE MATRIX AND NOWHERE ELSE. `--shard i/5` takes
    # its N from this list, so a fifth entry added without changing the divisor
    # would leave one shard running nothing; `check-shards` is what compares the
    # two, and `check-workflow` refuses an `i` outside `1..N` outright.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    # ⛔ FIVE SINCE 2026-10-15. Shard 2 of four took 19 minutes 5 seconds on run
    # 218 and was cancelled at the 20-minute bound on run 219, once `CI-09` and
    # `CLIENT-06` had added cases. The bound stays where it is, for the reason
    # below, and the work is spread over one more runner instead.
    # ⛔ 20 RATHER THAN 45, AND LOWERING IT IS THE POINT. The bound was raised to
    # 45 on 2026-09-10 to fit a job that had been cancelled at 30 minutes three
    # times, which this repository calls masking everywhere else. A shard is about
    # a quarter of the plants plus the controls every shard pays, so the bound
    # comes back down rather than staying where the growth put it.
    # ⚠ IT IS NOT 32.6/4. The controls are not sharded, so a shard is the control
    # floor plus its own quarter, and the margin here is over the measured floor
    # rather than over a division.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Cache downloaded crates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-crates-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-crates-
      - name: Cache build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      # ⛔ THE SAME PINNED shfmt THE OTHER LANE INSTALLS. Several of the cases
      # below run the gate, and the gate runs shell checks; a lane without it
      # would report a skip where the Linux lane reports a pass.
      # ⚠ THAT SENTENCE WAS NOT TRUE WHEN IT WAS WRITTEN. The gate ran neither
      # `shellcheck` nor `shfmt` over the scripts until `check-shell` landed on
      # 2026-09-10, which is what let this workflow go red on a tree whose local
      # gate was green. It is true now, and the row is what makes it so.
      - name: Install pinned shfmt
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.0
      # ⛔ THE PARTITION IS CHECKED BEFORE THE SHARD RUNS, and it is checked in
      # every shard rather than in one. It costs a few seconds because it uses
      # `--units`, which lists and runs nothing; putting it in one shard would
      # make three of the four lanes green over a selector nobody had asked about.
      - name: Shard partition
        run: sh scripts/ci/check-shards.sh
      - name: Workflow acceptance
        run: sh scripts/ci/check-workflow.sh --shard ${{ matrix.shard }}/5

  windows:
    name: Windows gate
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup show active-toolchain
      - name: Cache downloaded crates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-crates-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-crates-
      - name: Cache build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Host report
        shell: pwsh
        run: ./scripts/doctor/doctor.ps1 -Fast
      - name: Rust formatting
        shell: pwsh
        run: cargo fmt --all -- --check
      - name: Rust check
        shell: pwsh
        run: cargo check --workspace --locked --all-targets
      - name: Rust tests
        shell: pwsh
        run: cargo test --workspace --locked --all-targets
      - name: Rust lints
        shell: pwsh
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      # -Strict is what makes this lane able to see a check that stopped
      # running. It is possible here only because the runner counts a declared
      # unavailability apart from an observed skip: six of its rows are checks
      # Windows cannot run, and refusing those would refuse every correct tree.
      - name: Repository gate
        shell: pwsh
        run: ./scripts/common/check-gate.ps1 -Fast -Strict
