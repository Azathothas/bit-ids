name: Capture client

# ⛔ THERE IS NO `pull_request` TRIGGER AND THAT ABSENCE IS THE FORK GUARD, for
# the reason capture.yml gives and more sharply. This workflow INSTALLS SOMEBODY
# ELSE'S BINARY on a runner and then points it at a network, so a path from a
# fork would be a path from a stranger to an install on this account's runners.
#
# ⛔ AND NO `push` OR `schedule` EITHER. A merge must not be able to start an
# install, and neither must a clock.
on:
  workflow_dispatch:
    inputs:
      adapters:
        description: >-
          Which adapters to run, as a JSON array, e.g. ["aria2","transmission"]
        required: true
        # ⛔ THE DEFAULT IS THE DISPATCH WORTH RUNNING, and it changed on
        # 2026-09-09. It was aria2, transmission and qbittorrent; aria2 has now
        # hung inside *Install the client* on eleven dispatches out of eleven,
        # producing no log and no artifact and burning the job's whole 25
        # minutes, so a bare dispatch spent most of its time on the one lane that
        # cannot succeed. ⭐ `aria2-next` captures on both its routes in about
        # two minutes and eight, and with `routes` below is the only pairing
        # this project has that reaches a two-route comparison.
        # ⚠ The others are still one word away: pass them as this input.
        default: '["aria2-next"]'
        type: string
      # ⛔ ONE ROUTE PER HOST, WHICH IS WHY THIS IS A MATRIX DIMENSION AND NOT A
      # SECOND INSTALL STEP. `ACQ-03` compares what two routes installed, and two
      # routes on one machine means the second installs over the first: the
      # digest comparison then has one host's final state to look at rather than
      # two independent acquisitions. A host per route is what makes the pair
      # comparable at all.
      #
      # ⚠ THE DEFAULT IS THE PACKAGE ROUTE ALONE, which is what every dispatch so
      # far ran. Adding `"release"` runs a second host per adapter; the pair is
      # then two artifacts to compare rather than one, and `TODO/acquisition.md`
      # carries what a comparison needs beyond two green jobs.
      routes:
        description: >-
          Which acquisition routes to run, as a JSON array. One of package,
          release or source, e.g. ["release","source"]. A route a target cannot
          satisfy fails its own job and leaves the others' measurements intact.
        required: true
        # ⚠ RELEASE AND SOURCE, because `aria2-next` has no package route and
        # those two are what run 14 measured at one version.
        default: '["release","source"]'
        type: string
      seconds:
        description: How long the observer serves before its own deadline stops it
        required: true
        default: "45"
        type: string
      peer_port:
        description: The port the client is told to listen on, so the lab can dial it
        required: true
        default: "51413"
        type: string
      # ⛔ A SECOND HOST IMAGE, BECAUSE THE FIRST ONE IS A DEAD END. *Install the
      # client* wedged on `ubuntu-24.04` in run 32 with no privilege left in it
      # and again in run 33 on 2026-10-11, twenty-five days and several image
      # updates later, on a release lane that takes seconds when it works.
      # `TODO/RULES.md`: a hang is not diagnosed, it is routed around, and the
      # host image is the one variable the recorded readings left standing that
      # changing costs nothing.
      # ⚠ A CHOICE AND NOT A STRING, so a dispatch can name only an image this
      # file lists: `runs-on` takes the value verbatim.
      runner:
        description: The hosted image every lane runs on
        required: true
        default: ubuntu-24.04
        type: choice
        options:
          - ubuntu-24.04
          - ubuntu-22.04

permissions:
  contents: read

# ⛔ NEVER CANCELLED IN FLIGHT. Between *Cut the route* and *Restore the route*
# these hosts have no way off themselves, and a cancellation in that window
# leaves the runner unable to report, the evidence unuploaded and the marker
# written. ⚠ A separate group from capture.yml's, because these are different
# hosts running a different experiment and queueing one behind the other would
# serialise two things that never share a machine.
concurrency:
  group: capture-client
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux client capture (${{ matrix.adapter }}, ${{ matrix.route }}, ${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    # ⛔ 35, BECAUSE THE BOUNDS BELOW HAVE TO FIT UNDER IT AND AT 25 THEY DID NOT.
    # A source lane can spend 1380s in *Install the client* before its own last
    # resort fires, and the steps ahead of it - checkout, the toolchain, the
    # cargo build, the resolve - are a further three minutes or so. ⚠ A job
    # cancelled by THIS number uploads nothing at all, measured on runs 21, 22
    # and 23, so it must be the bound that never fires rather than the one that
    # catches a hang. ⭐ The bounds inside the step are what end a hang, and they
    # end it with the evidence still on the runner.
    timeout-minutes: 35
    # ⛔ READ ONLY. A capture produces an artifact and never a commit.
    permissions:
      contents: read
    strategy:
      # ⛔ ONE ADAPTER'S FAILURE MUST NOT CANCEL THE OTHERS. Each job is a
      # separate host running a separate product, and a matrix that stopped at
      # the first red would throw away measurements that had already been taken
      # on machines that are about to be destroyed.
      fail-fast: false
      # ⛔ THE CROSS PRODUCT IS THE POINT, NOT AN ACCIDENT OF THE SHAPE. Every
      # (adapter, route) pair is a separate host that acquires one target through
      # one route, which is the design `install-client` already enforces by
      # taking one `--route` per call. ⚠ A route a target cannot satisfy fails
      # its own job and leaves every other job's measurement intact - which is
      # what `fail-fast: false` above is for, and is the honest state for
      # transmission's release route today.
      matrix:
        adapter: ${{ fromJSON(inputs.adapters) }}
        route: ${{ fromJSON(inputs.routes) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ⛔ FIRST, BEFORE ANYTHING ELSE WRITES TO THE HOST, and before anything is
      # installed. The claim refuses a host that already ran a capture, and a
      # product installed before the claim would be state on a machine nothing
      # had established was disposable.
      # ⛔ AND IT IS UNPRIVILEGED, WHICH IS LOAD-BEARING RATHER THAN TIDY. The
      # marker is under this user's own state directory now, so a claim written
      # by root would be a file the unprivileged install step then cannot find -
      # and `install-client` refuses a host nothing claimed. `ACQ-06`.
      - name: Claim the host
        env:
          RUN_ID: capture-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.adapter }}-${{ matrix.route }}
        run: sh scripts/acquisition/assert-disposable.sh --claim "$RUN_ID"

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      # ⛔ THE BUILD HAPPENS HERE, WHILE THE NETWORK STILL EXISTS - and that is
      # every binary this job will run, not only the observer. `resolve-release`
      # refuses rather than building, for the reason `capture-run` does: a step
      # that discovered a missing dependency later would have to reach a crate
      # registry from a host whose route is about to be cut.
      #
      # ⚠ Both resolver examples are built on the package lane too, which costs
      # seconds and keeps this step's command free of a condition. A build that
      # sometimes ran is a build whose absence is a matrix leg nobody reads.
      - name: Build the observer
        run: |
          set -eu
          cargo build -p bit-ids-probe --locked --example client-capture
          cargo build -p bit-ids --locked --example resolve-stable --example select-asset

      # ⛔ AND SO DOES THE INSTALL, FOR THE SAME REASON AND ONE MORE. capture-client
      # refuses to install anything, so a product that is not here by now is not
      # in this capture; and an install under containment could not reach a
      # package index at all.
      #
      # ⛔ AND THE INSTALL IS UNPRIVILEGED. It used to run `setsid sudo -E
      # timeout`, because a `package` route needs root and `/usr/local/bin` does
      # too; `ACQ-06` took both out of the path a capture depends on. The install
      # directory is under RUNNER_TEMP and the build lands in a prefix this user
      # owns, so nothing it leaves behind can be mistaken for a tracked file and
      # nothing it does depends on a host this project does not control.
      # ⚠ The `package` route is privileged by construction and is NOT on that
      # path: `E-ACQ-01` wants two independent routes and `release` plus `source`
      # already are.
      # ⛔ AND THE ARTIFACT IS CHOSEN BEFORE THE ROUTE IS CUT, WHICH IS WHY THIS
      # STEP EXISTS AT ALL. Every `release` route in this tree refuses without
      # `BIT_IDS_RELEASE_URL`, and until now nothing produced one: `resolve-stable`
      # orders versions and does not select an artifact. `resolve-release` reads
      # the repository, the version scheme and the asset pattern out of the
      # adapter's own `describe`, so this step carries no per-target knowledge and
      # needs no case over `matrix.adapter`.
      #
      # ⚠ THE PACKAGE LANE SKIPS IT because a package index needs no artifact
      # chosen, and a step that ran anyway would fetch a vendor listing that
      # nothing in that lane reads.
      # ⛔ AND THE SOURCE LANE NO LONGER SHARES IT. This step used to resolve for
      # both lanes, on the reasoning that one resolver is how absolute 4's
      # same-version rule is made true rather than checked. `E-ACQ-07` refuses
      # exactly that - two routes sharing a resolver are one route - and
      # `assemble-capture` measured it on run 14, whose two resolution records
      # differ only in their timestamps. ⭐ Absolute 4 checks version equality
      # AFTER installation, so two resolutions that disagree are a vendor that
      # moved between two reads and catching it is the point.
      - name: Resolve the release artifact
        if: matrix.route == 'release'
        env:
          ADAPTER: scripts/capture/adapters/${{ matrix.adapter }}.sh
        run: |
          set -eu
          # ⛔ THE DIRECTORY IS MADE BEFORE THE REDIRECTION, NOT BY THE SCRIPT.
          # A shell opens `>` targets before it execs the command, so a workdir
          # created inside `resolve-release` is created too late for a redirect
          # into it and the step dies on the redirection rather than on anything
          # the script did.
          mkdir -p "$RUNNER_TEMP/release"
          sh scripts/acquisition/resolve-release.sh \
            --adapter "$ADAPTER" \
            --workdir "$RUNNER_TEMP/release" \
            --record "$RUNNER_TEMP/release/resolution.txt" \
            >"$RUNNER_TEMP/release/url.txt"
          cat "$RUNNER_TEMP/release/resolution.txt"

      # ⭐ THE SOURCE LANE'S OWN RESOLUTION, FROM THE REPOSITORY'S OWN REFS.
      # `git ls-remote --tags` asks the repository what tags exist; a releases
      # listing asks an API what release OBJECTS were published, which is a
      # different and much smaller population - measured on 2026-09-05,
      # qbittorrent's releases endpoint answered with four entries where its tags
      # endpoint answered with at least a hundred. Two indexes that can disagree
      # about the newest version are two resolvers, which is what `E-ACQ-07`
      # compares and what makes this pair two routes.
      #
      # ⚠ IT RUNS BEFORE THE ROUTE IS CUT, for the reason every fetch here does:
      # a host with no default route cannot reach a repository, and restoring
      # egress to find out which tag to build would undo the containment on the
      # machine that exists to have it.
      - name: Resolve the source tag
        if: matrix.route == 'source'
        env:
          ADAPTER: scripts/capture/adapters/${{ matrix.adapter }}.sh
        run: |
          set -eu
          # ⛔ THE DIRECTORY IS MADE BEFORE THE REDIRECTION, for the reason the
          # step above gives: a shell opens `>` targets before it execs.
          mkdir -p "$RUNNER_TEMP/source"
          sh scripts/acquisition/resolve-source.sh \
            --adapter "$ADAPTER" \
            --workdir "$RUNNER_TEMP/source" \
            --record "$RUNNER_TEMP/source/resolution.txt" \
            >"$RUNNER_TEMP/source/tag.txt"
          cat "$RUNNER_TEMP/source/resolution.txt"

      # ⛔ TEN DIAGNOSTIC PROBE STEPS STOOD HERE AND THEY ARE DELETED. `ACQ-06`.
      # They were `CI-08`'s instrument for the install hang: named steps whose
      # only purpose was that the API reports WHICH one a wedged job stopped in.
      # Run 29 spent the last of what they could buy - all seven passed in FOUR
      # seconds while the step composing them ran for thirty minutes - so every
      # component was excluded on its own and no further probe of a component
      # could reach the composition.
      #
      # ⛔ AND FOUR OF THEM MEASURED A PATH THIS TREE NO LONGER TAKES. They
      # probed `sudo`, a `sudo -n cp` into `/usr/local/bin`, the claim guard
      # under `sudo`, and the `setsid sudo -E timeout` launch shape. The install
      # is rootless now, so those four described operations nothing performs, and
      # one of them would have printed root's marker path over a host claimed by
      # this user - a diagnostic answering confidently and wrongly.
      #
      # ⚠ `TODO/RULES.md` is why they go rather than stay: a hang is a dead end,
      # not a subject. The route that avoids it is this one, and keeping the
      # instruments of the dead end in the file is keeping the subject open.

      # ⛔ THE WORK IS IN A FILE SO THE STEP'S OWN PROCESS CAN BE BOUNDED. That is
      # the one place a bound has not been tried here, and every other place has
      # been measured failing: `install-step.sh` says which and why.
      #
      # ⛔ AND NOTHING THE ROUTE SPAWNS INHERITS THIS STEP'S OUTPUT. A runner ends
      # a `run:` step when the command has exited AND the step's output pipe has
      # reached end of file, so a single process the product leaves behind holding
      # that pipe keeps the step open with an exit code of 0 sitting in it.
      # `scripts/ci/check-step-bodies.sh` runs this step's body and measures both
      # halves of that.
      #
      # ⛔ THAT CLAIM WAS NARROWER THAN THE TRUTH UNTIL 2026-09-16, AND RUN 24 IS
      # THE MEASUREMENT. `install-step.sh` redirected everything IT started, and
      # then inherited the step's own pipe itself - so the guarantee stopped one
      # level above where it was written. Run 24's install step was still open
      # **twenty minutes** in, having passed BOTH its bounds: the privileged 780s
      # at 03:03:45 and the outer 900s at 03:05:45. A bound that fires cannot end
      # a step whose pipe is still held, which is this file's own sentence used
      # against it.
      #
      # ⭐ SO THE WHOLE SUBTREE GETS A FILE. `install-step.sh` and everything
      # beneath it write to `install-step.log`; this shell cats it afterwards.
      # The step's pipe is then held by THIS shell and nothing else, so the step
      # ends when this shell does, whatever the route left running.
      - name: Install the client
        env:
          ADAPTER: scripts/capture/adapters/${{ matrix.adapter }}.sh
          ROUTE: ${{ matrix.route }}
          # ⭐ THE INNER BOUND IS RAISED FOR A SOURCE BUILD AND ONLY FOR ONE.
          # `install-client` bounds the adapter call at 420 seconds by default,
          # and `aria2-next`'s source route was measured at 366 - fifty-four
          # seconds of margin, which a slower runner spends. ⚠ 500 keeps it UNDER
          # the step's own 540, so a build that overruns is refused by
          # `install-client` with a message naming the timeout rather than killed
          # by the outer bound with nothing to read.
          # ⛔ Every other route keeps 420 exactly: the aria2 lanes are what that
          # number was measured against, and this must not quietly move it.
          # ⛔ 900 FOR A SOURCE BUILD, AND 500 WAS MEASURED TOO TIGHT. The first
          # two-route capture put that step at **496 seconds** against a bound of
          # 500: four seconds of margin, which is not a margin. ⚠ The runner is
          # about 1.35x slower than the host this was sized on, where the same
          # build took 366 - so a number measured locally is a lower bound on
          # what a runner needs, never an estimate of it.
          BIT_IDS_INSTALL_TIMEOUT: ${{ matrix.route == 'source' && '900' || '420' }}
          # ⛔ THE STEP'S OWN BOUND, AND THE ARITHMETIC IS STATED BECAUSE IT DID
          # NOT ADD UP BEFORE. ⚠ It was the PRIVILEGED bound until `ACQ-06`: the
          # install ran under `sudo` and the bound had to live inside it, because
          # a uid-1001 `timeout` cannot signal a root tree. The install runs as
          # this uid now, so the bound and its target are the same user and the
          # number is all that is left of that paragraph.
          # `install-client` can spend its install bound AND
          # two version bounds (60 each) AND three describe bounds (30 each)
          # before it is done, which is 630 on a release lane and 1110 on a
          # source one. ⚠ The outer bound below was 1080 for both, so a source
          # lane's own inner bounds could sum ABOVE the bound meant to outlast
          # them - the killing would then happen outside, with nothing to read,
          # which is the failure mode every number here exists to avoid.
          #
          # ⭐ Each bound must outlast the one inside it: inner sum < this <
          # the step's `timeout` < the job's `timeout-minutes`.
          BIT_IDS_STEP_TIMEOUT: ${{ matrix.route == 'source' && '1260' || '780' }}
          # ⛔ THE OUTER BOUND IS AN ENVIRONMENT VALUE AND NOT AN EXPRESSION IN
          # THE `run:` LINE, because `check-step-bodies` LIFTS that line and runs
          # it as shell. A `${{ }}` left in the body is not shell, so the harness
          # that exists to prove this exact step ends would fail on every case
          # over an unexpanded expression - measured on 2026-09-16, five cases at
          # once, with the plant reporting *did not apply*.
          OUTER_TIMEOUT: ${{ matrix.route == 'source' && '1380' || '900' }}
        # ⛔ A STEP-LEVEL BOUND, AND IT IS NOT A TWELFTH SHELL BOUND. Every bound
        # this entry has spent acts on the step's own process from inside the
        # step; this one is the RUNNER's, and it differs in the one way that
        # matters here: exceeding it marks the step FAILED rather than cancelling
        # the job. ⭐ A failed step still runs the `if: always()` steps after it,
        # so the install logs - and the `ps` timeline in them - reach an upload.
        # A cancelled job uploads nothing, measured on runs 21 to 29.
        #
        # ⚠ IT HAS BEEN TRIED ONCE AND THE MEASUREMENT DOES NOT COVER THIS CASE.
        # `timeout-minutes: 5` was measured on run 6 not to fire - on *Upload the
        # install logs*, which is a `uses:` step whose work happens inside an
        # action. This is a `run:` step, which the runner supervises directly, and
        # that difference is why it is worth one measurement rather than none.
        #
        # ⚠ THE RELATION, as everywhere here: each bound outlasts the one inside
        # it. Inner sum < BIT_IDS_STEP_TIMEOUT < OUTER_TIMEOUT < this < the job's
        # `timeout-minutes`, which is 35. For a release lane that is
        # 630 < 780 < 900 < 1020 < 2100 seconds.
        timeout-minutes: ${{ matrix.route == 'source' && 25 || 17 }}
        # ⛔ THE BOUND IS ON THE STEP'S OWN PROCESS, WHICH IS THE ONE PLACE IT HAS
        # NOT BEEN TRIED. `timeout` inside `install-client` ends its own child and
        # cannot end a shell blocked around it; `timeout-minutes` is the runner's
        # and was measured on run 6 not to end the step; and a watchdog loop in
        # the step's own shell was measured on run 9 not to fire, its deadline
        # passing by three minutes. This one needs nothing inside the step to be
        # reachable.
        #
        # ⚠ 1080 SECONDS, UNDER THE JOB'S 25 MINUTES WITH ROOM FOR THE CAPTURE
        # AND THE UPLOADS. What it buys is not a faster failure: it is a job that
        # reaches its uploads at all, because a runner that is killed leaves no
        # log and no artifact - measured on runs 7, 8 and 9.
        # ⛔ IT WAS 540 AND A SOURCE BUILD DOES NOT FIT UNDER THAT. The first
        # two-route capture spent 496 seconds in this step, so the inner bound
        # had to grow past 540 and this one with it. ⚠ The relation is what
        # matters: the inner bound refuses with a message naming the timeout, and
        # this outer one exists only so a job that blows through it still reaches
        # its uploads - so this must stay the LARGER of the two.
        # ⚠ A capture takes about 50 seconds and the uploads about 1, so 1080
        # leaves the 25-minute job roughly five minutes of slack.
        # ⛔ IT WAS A FLAT 1080 AND THAT WAS SMALLER THAN THE SOURCE LANE'S OWN
        # INNER BOUNDS. Per route now, each 120s above `BIT_IDS_STEP_TIMEOUT`, so
        # the privileged bound inside `install-step.sh` is always the one that
        # fires first and this one stays what it was designed to be: the last
        # resort that gets the job to its uploads.
        # ⚠ `${OUTER_TIMEOUT:-1080}` keeps this line runnable OUTSIDE a dispatch,
        # which is what `check-step-bodies` does with it.
        #
        # ⛔ THE REDIRECTION IS THE POINT AND ITS ORDER MATTERS. `>file 2>&1`
        # hands the whole subtree a regular file, so no descendant can hold this
        # step's pipe. ⚠ `</dev/null` too: a descendant inheriting the step's
        # stdin is the same class through the door nobody watches.
        # ⚠ AND THE EXIT CODE IS CARRIED BY HAND, because the last command here
        # is the `cat` and a step that reported the cat's status would call a
        # refused install green.
        run: |
          set -u
          timeout -k 30 "${OUTER_TIMEOUT:-1080}" sh scripts/acquisition/install-step.sh \
            >"$RUNNER_TEMP/install-step.log" 2>&1 </dev/null
          rc=$?
          cat "$RUNNER_TEMP/install-step.log" || true
          exit "$rc"
        # ⚠ The body this replaced is in that file, unchanged in what it does.

      # ⛔ BOTH ADDRESS FAMILIES. A host with IPv4 unplugged and IPv6 up still
      # reaches the internet.
      - name: Cut the route off this host
        run: |
          set -eu
          ip route show default >"$RUNNER_TEMP/routes-v4"
          ip -6 route show default >"$RUNNER_TEMP/routes-v6" 2>/dev/null || : >"$RUNNER_TEMP/routes-v6"
          while ip route show default | grep -q .; do sudo ip route del default; done
          while ip -6 route show default 2>/dev/null | grep -q .; do sudo ip -6 route del default; done
          printf 'saved %s v4 and %s v6 default route(s)\n' \
            "$(wc -l <"$RUNNER_TEMP/routes-v4")" "$(wc -l <"$RUNNER_TEMP/routes-v6")"

      # ⛔ THE GUARD READS THE KERNEL RATHER THAN THE STEP ABOVE. The deletion is
      # a command that was run; this is the routing table as it now stands.
      - name: Assert containment
        run: sh scripts/acquisition/assert-disposable.sh --egress

      # ⭐ AND HERE A PRODUCT THIS PROJECT DID NOT WRITE IS HANDED THE TORRENT.
      # It learns the tracker's address by reading the file, which is what a
      # stock build does with any torrent, so nothing about this run is a control
      # the product does not already have.
      - name: Capture
        env:
          RUN_ID: capture-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.adapter }}-${{ matrix.route }}
          SECONDS_TO_SERVE: ${{ inputs.seconds }}
          PEER_PORT: ${{ inputs.peer_port }}
          ADAPTER: scripts/capture/adapters/${{ matrix.adapter }}.sh
        run: |
          sh scripts/capture/capture-client.sh \
            --run-id "$RUN_ID" \
            --out "$RUNNER_TEMP/capture" \
            --observer "$GITHUB_WORKSPACE/target/debug/examples/client-capture" \
            --adapter "$ADAPTER" \
            --connector scripts/capture/connectors/cpython-stdlib.py \
            --peer-port "$PEER_PORT" \
            --seconds "$SECONDS_TO_SERVE"

      # ⚠ ONLY TO UPLOAD, AND ONLY AFTER THE MEASUREMENT IS FINISHED.
      #
      # ⭐ THE RESTORE IS VERIFIED BY THE SAME GUARD, INVERTED: a host that can
      # reach the network again is one the egress guard REFUSES.
      - name: Restore the route
        run: |
          set -eu
          # ⛔ AN ADD THAT FAILS IS REPORTED AND DOES NOT END THE STEP. Under
          # set -e the first refused `ip route add` would end this step, the
          # upload would be skipped as a consequence, and a finished capture
          # would be thrown away over a route.
          while IFS= read -r route; do
            [ -n "$route" ] || continue
            # shellcheck disable=SC2086
            sudo ip route add $route || echo "could not restore: $route" >&2
          done <"$RUNNER_TEMP/routes-v4"
          while IFS= read -r route; do
            [ -n "$route" ] || continue
            # shellcheck disable=SC2086
            sudo ip -6 route add $route || echo "could not restore: $route" >&2
          done <"$RUNNER_TEMP/routes-v6"
          # ⛔ THE GUARD HAS THREE CODES AND THIS READS ALL THREE. ⚠ An `if`
          # would fold 1 and 2 together and upload from a host nothing
          # established was reachable.
          sh scripts/acquisition/assert-disposable.sh --egress && egress=0 || egress=$?
          if [ "$egress" = 0 ]; then
            echo 'the default route was not restored; the upload cannot work' >&2
            exit 1
          fi
          if [ "$egress" != 1 ]; then
            echo "the egress guard could not run (exit $egress)" >&2
            exit 1
          fi
          exit 0

      # ⛔ if-no-files-found IS `error`. An upload that found nothing and exited
      # 0 would leave a green capture run with no evidence anywhere.
      #
      # ⚠ The install record goes up beside the bundle, because `ACQ-03` compares
      # what each route's installed build REPORTED and that answer lives there.
      - name: Upload the evidence bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capture-client-${{ matrix.adapter }}-${{ matrix.route }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/capture
            ${{ runner.temp }}/install-${{ matrix.route }}.txt
          if-no-files-found: error
          retention-days: 90

      # ⛔ THE INSTALL'S OWN LOGS GO UP WHETHER OR NOT ANYTHING BEFORE THIS
      # WORKED, and `if: always()` is what makes that true from here rather than
      # from before the capture. It sat between the install and the route cut for
      # four dispatches, on the reasoning that a job which never reached the
      # capture would otherwise upload nothing - and an `always()` step at the end
      # of the job runs after a failed step too, so the early position bought
      # nothing that this one does not.
      #
      # ⛔ WHAT IT COST WAS EVERY aria2 CAPTURE. That step has hung on every aria2
      # job since run 3, *after* completing its upload: on run 6 the package
      # lane's artifact was written one second in and the step had not returned
      # seventeen minutes later. From here a hang costs the job's tail rather than
      # the measurement, because the capture and the evidence upload have already
      # happened.
      #
      # ⚠ A BOUND WAS TRIED AND IT DOES NOT FIRE. `timeout-minutes: 5` on this
      # step was measured on run 6 against a step that ran seventeen minutes, so
      # it is not kept: a bound that has been seen not to bound the one failure it
      # was added for is decoration. `CI-08` owns the cause.
      #
      # ⛔ AND IT MUST COME AFTER *Restore the route*, like every other upload:
      # between the cut and the restore this host has no way off itself, so an
      # upload there could not reach GitHub at all.
      #
      # ⚠ if-no-files-found is `warn` rather than `error`: a job that failed
      # before the workdir existed has nothing to upload, and failing this step
      # would replace one missing diagnosis with another. ⛔ `continue-on-error`
      # is deliberate here and nowhere else - this upload is a diagnostic aid and
      # the evidence bundle above stays fatal.
      #
      # ⛔ LOGS AND RECORDS, NAMED, RATHER THAN THE WHOLE WORKDIR. A source-build
      # route unpacks a tarball and compiles it *in* that workdir, so uploading
      # the directory uploads a build tree: measured on run 5, 42.6 megabytes and
      # 1867 entries for a step called *Upload the install logs*. ⚠ The package
      # route's workdir happens to hold two log files, which is why the directory
      # form looked right for four dispatches.
      - name: Upload the install logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-${{ matrix.adapter }}-${{ matrix.route }}-${{ github.run_id }}-${{ github.run_attempt }}
          # ⛔ THE SOURCE ROUTE'S RESOLUTION SHIPS TOO, AND IT DID NOT UNTIL
          # 2026-09-15. This list named `release/` alone, which was complete for
          # as long as the source lane resolved through the release listing -
          # which is exactly what `E-ACQ-07` refused run 14 for. ⚠ The moment
          # that was repaired, *Resolve the source tag* began writing
          # `$RUNNER_TEMP/source/resolution.txt` and nothing carried it off the
          # runner, so run 16 uploaded two green lanes and `assemble-capture`
          # refused with *the source route has no resolution*.
          #
          # ⚠ Top-level globs, no `**`, for the reason this step's comment above
          # gives and `install-client`'s rule-12 scan now depends on: a `*` does
          # not descend, so a resolver workdir that ever held a clone would not
          # ship it.
          #
          # ⭐ AND THE ROOTLESS INSTALLER'S OWN REPORT SHIPS, WHICH IS WHERE THE
          # ARTIFACT'S DIGEST AND ITS DISPOSITION ARE WRITTEN. `ACQ-06`. ⚠ It is
          # a `.txt` at the workdir's top level, so `install-client`'s rule-12
          # scan - which reads EVERY file at that level - is still wider than
          # what this ships.
          path: |
            ${{ runner.temp }}/install-${{ matrix.route }}/*.log
            ${{ runner.temp }}/install-${{ matrix.route }}/*.err
            ${{ runner.temp }}/install-${{ matrix.route }}/*.txt
            ${{ runner.temp }}/install-${{ matrix.route }}.txt
            ${{ runner.temp }}/install-step.log
            ${{ runner.temp }}/release/*.txt
            ${{ runner.temp }}/release/*.json
            ${{ runner.temp }}/release/*.err
            ${{ runner.temp }}/source/*.txt
            ${{ runner.temp }}/source/*.json
            ${{ runner.temp }}/source/*.err
          if-no-files-found: warn
          retention-days: 30

      # ⚠ A FINGERPRINT IS COMPARABLE ONLY AGAINST ONE THE SAME HALF PRODUCED,
      # and on Linux a repeat really does mean a survived host.
      - name: Report the host fingerprint
        if: always()
        env:
          ROUTE: ${{ matrix.route }}
        run: |
          set -eu
          print=$(sh scripts/acquisition/assert-disposable.sh --fingerprint)
          echo "linux host fingerprint: $print"
          {
            echo "### ${{ matrix.adapter }} (${{ matrix.route }})"
            echo
            echo "host fingerprint \`$print\`"
            echo
            echo 'Compare against the previous **Linux** run. A repeat means the host was not destroyed.'
            echo
            echo '```'
            cat "$RUNNER_TEMP/release/resolution.txt" 2>/dev/null || echo 'no release resolution'
            echo '```'
            echo
            echo '```'
            cat "$RUNNER_TEMP/install-$ROUTE.txt" 2>/dev/null || echo 'no install record'
            echo '```'
            echo
            echo '```'
            cat "$RUNNER_TEMP/capture/attestation.txt" 2>/dev/null || echo 'no attestation'
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
