name: Capture client

# ⛔ THERE IS NO `pull_request` TRIGGER AND THAT ABSENCE IS THE FORK GUARD, for
# the reason capture.yml gives and more sharply. This workflow INSTALLS SOMEBODY
# ELSE'S BINARY on a runner and then points it at a network, so a path from a
# fork would be a path from a stranger to an install on this account's runners.
#
# ⛔ AND NO `push` OR `schedule` EITHER. A merge must not be able to start an
# install, and neither must a clock.
on:
  workflow_dispatch:
    inputs:
      adapters:
        description: >-
          Which adapters to run, as a JSON array, e.g. ["aria2","transmission"]
        required: true
        # ⛔ THE DEFAULT IS THE DISPATCH WORTH RUNNING, and it changed on
        # 2026-09-09. It was aria2, transmission and qbittorrent; aria2 has now
        # hung inside *Install the client* on eleven dispatches out of eleven,
        # producing no log and no artifact and burning the job's whole 25
        # minutes, so a bare dispatch spent most of its time on the one lane that
        # cannot succeed. ⭐ `aria2-next` captures on both its routes in about
        # two minutes and eight, and with `routes` below is the only pairing
        # this project has that reaches a two-route comparison.
        # ⚠ The others are still one word away: pass them as this input.
        default: '["aria2-next"]'
        type: string
      # ⛔ ONE ROUTE PER HOST, WHICH IS WHY THIS IS A MATRIX DIMENSION AND NOT A
      # SECOND INSTALL STEP. `ACQ-03` compares what two routes installed, and two
      # routes on one machine means the second installs over the first: the
      # digest comparison then has one host's final state to look at rather than
      # two independent acquisitions. A host per route is what makes the pair
      # comparable at all.
      #
      # ⚠ THE DEFAULT IS THE PACKAGE ROUTE ALONE, which is what every dispatch so
      # far ran. Adding `"release"` runs a second host per adapter; the pair is
      # then two artifacts to compare rather than one, and `TODO/acquisition.md`
      # carries what a comparison needs beyond two green jobs.
      routes:
        description: >-
          Which acquisition routes to run, as a JSON array. One of package,
          release or source, e.g. ["release","source"]. A route a target cannot
          satisfy fails its own job and leaves the others' measurements intact.
        required: true
        # ⚠ RELEASE AND SOURCE, because `aria2-next` has no package route and
        # those two are what run 14 measured at one version.
        default: '["release","source"]'
        type: string
      seconds:
        description: How long the observer serves before its own deadline stops it
        required: true
        default: "45"
        type: string
      peer_port:
        description: The port the client is told to listen on, so the lab can dial it
        required: true
        default: "51413"
        type: string
      # ⭐ THE WINDOWS LANE, `CI-11`. Its own adapter list, because only a
      # target with a Windows half can run there: `qbittorrent`,
      # `transmission` and `aria2-next` today. ⚠ THE DEFAULT IS NONE, so a
      # bare dispatch runs what it ran before this lane existed; pass
      # `["qbittorrent"]` to run it. Decided unattended on 2026-10-15 and
      # recorded in
      # `TODO/PROGRESS.md`.
      windows_adapters:
        description: >-
          Which adapters to run on Windows, as a JSON array, of qbittorrent,
          transmission and aria2-next, e.g. ["qbittorrent"]. [] runs no
          Windows lane.
        required: true
        default: '[]'
        type: string
      # ⚠ ITS OWN ROUTES TOO: the Windows half's second route is a package
      # manager, winget or (for `aria2-next`) Scoop, where Linux's is a
      # source build.
      windows_routes:
        description: >-
          Which acquisition routes the Windows lane runs, as a JSON array, of
          package and release.
        required: true
        default: '["release","package"]'
        type: string

permissions:
  contents: read

# ⛔ NEVER CANCELLED IN FLIGHT. A capture cancelled mid-run leaves the evidence
# unuploaded and the claim marker written. ⚠ A separate group from capture.yml's,
# because these are different hosts running a different experiment and queueing
# one behind the other would serialise two things that never share a machine.
concurrency:
  group: capture-client
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux client capture (${{ matrix.adapter }}, ${{ matrix.route }})
    # ⚠ `[]` RUNS NO LINUX LANE, as `windows_adapters` does for the Windows
    # job: a Windows-only dispatch exists because a Linux pair already on `data`
    # cannot be published twice, and assemble-bundle run 38823655690 refused
    # the whole bundle for re-capturing two. `CI-11`.
    if: inputs.adapters != '[]'
    runs-on: ubuntu-24.04
    # ⛔ 45, BECAUSE THE BOUNDS BELOW HAVE TO FIT UNDER IT. A source lane can
    # spend 1980s in *Install the client* before its own last resort fires, and
    # the steps ahead of it are a further three minutes or so; a source build of
    # `aria2-next` took 12.5 minutes end to end on 2026-10-11, and `v3.0.2`
    # took 870 seconds to configure and build on the session host on 2026-10-14.
    # ⚠ A job cancelled by THIS number uploads nothing, so it is the bound that
    # should never fire.
    timeout-minutes: 45
    # ⛔ READ ONLY. A capture produces an artifact and never a commit.
    # ⚠ `checks: write` IS THE FLIGHT RECORDER'S AND NOTHING ELSE'S: it posts
    # this host's state as a check run's output while the job runs, which is the
    # only channel that leaves a host that never reaches its uploads. A token
    # that can annotate a commit cannot change one.
    permissions:
      contents: read
      checks: write
    strategy:
      # ⛔ ONE ADAPTER'S FAILURE MUST NOT CANCEL THE OTHERS. Each job is a
      # separate host running a separate product, and a matrix that stopped at
      # the first red would throw away measurements that had already been taken
      # on machines that are about to be destroyed.
      fail-fast: false
      # ⛔ THE CROSS PRODUCT IS THE POINT, NOT AN ACCIDENT OF THE SHAPE. Every
      # (adapter, route) pair is a separate host that acquires one target through
      # one route, which is the design `install-client` already enforces by
      # taking one `--route` per call. ⚠ A route a target cannot satisfy fails
      # its own job and leaves every other job's measurement intact - which is
      # what `fail-fast: false` above is for, and is the honest state for
      # transmission's release route today.
      matrix:
        adapter: ${{ fromJSON(inputs.adapters) }}
        route: ${{ fromJSON(inputs.routes) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ⭐ `bit-check` FIRST, BECAUSE THE CLAIM IS ONE OF ITS COMMANDS. The guard
      # is `bit-check assert-disposable` since 2026-10-15, `CI-11`, and every
      # later step finds the binary through BIT_CHECK; nothing on the capture
      # path builds it. ⚠ This writes this project's own binary into RUNNER_TEMP
      # before the claim, which is not a product's state: the claim's marker is
      # what a survived host carries, and this build leaves none. ⚠ It is ahead
      # of the flight recorder too, which is `bit-check flight-recorder` since
      # 2026-10-16: a Go build with no dependencies fetches nothing, so the one
      # step the recorder cannot see is one that cannot wedge on the network.
      - name: Build bit-check
        run: |
          set -eu
          (cd tools/check && go build -o "$RUNNER_TEMP/bit-check" .)
          printf 'BIT_CHECK=%s\n' "$RUNNER_TEMP/bit-check" >>"$GITHUB_ENV"

      # ⛔ EVIDENCE THAT LEAVES THE HOST AS IT IS TAKEN. Runs 3 to 34 wedged in
      # *Install the client* and left no artifact and no job log at all, so every
      # instrument that wrote to this disk measured nothing. The recorder posts a
      # snapshot - blocked tasks and their kernel stacks, memory, disk, the
      # kernel ring buffer, the install logs' tails - to a check run every few
      # seconds; if the posts stop, the host lost contact at that moment.
      # ⚠ IT HOLDS NO PIPE OF THIS STEP. Every descriptor goes to a file, which
      # is the defect class this workflow has already paid for.
      - name: Start the flight recorder
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ matrix.adapter }}-${{ matrix.route }}
        run: |
          setsid "$BIT_CHECK" flight-recorder "$LABEL" "$RUNNER_TEMP" \
            >"$RUNNER_TEMP/flight-recorder.log" 2>&1 </dev/null &
          sleep 5
          cat "$RUNNER_TEMP/flight-recorder.log"

      # ⛔ FIRST, BEFORE ANYTHING ELSE WRITES TO THE HOST, and before anything is
      # installed. The claim refuses a host that already ran a capture, and a
      # product installed before the claim would be state on a machine nothing
      # had established was disposable.
      # ⛔ AND IT IS UNPRIVILEGED, WHICH IS LOAD-BEARING RATHER THAN TIDY. The
      # marker is under this user's own state directory now, so a claim written
      # by root would be a file the unprivileged install step then cannot find -
      # and `install-client` refuses a host nothing claimed. `ACQ-06`.
      - name: Claim the host
        env:
          RUN_ID: capture-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.adapter }}-${{ matrix.route }}
        run: |
          "$BIT_CHECK" assert-disposable --claim "$RUN_ID"

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      # ⛔ THE BUILD HAPPENS HERE, WHILE THE NETWORK STILL EXISTS - and that is
      # every binary this job will run, not only the observer. `resolve-release`
      # refuses rather than building, for the reason `capture-run` does: a step
      # that discovered a missing dependency later would have to reach a crate
      # registry from a host whose route is about to be cut.
      #
      # ⚠ Both resolver examples are built on the package lane too, which costs
      # seconds and keeps this step's command free of a condition. A build that
      # sometimes ran is a build whose absence is a matrix leg nobody reads.

      - name: Build the observer
        run: |
          set -eu
          cargo build -p bit-ids-probe --locked --example client-capture
          cargo build -p bit-ids --locked --example resolve-stable --example select-asset

      # ⛔ AND SO DOES THE INSTALL, FOR THE SAME REASON AND ONE MORE. capture-client
      # refuses to install anything, so a product that is not here by now is not
      # in this capture; and an install under containment could not reach a
      # package index at all.
      #
      # ⛔ AND THE INSTALL IS UNPRIVILEGED. It used to run `setsid sudo -E
      # timeout`, because a `package` route needs root and `/usr/local/bin` does
      # too; `ACQ-06` took both out of the path a capture depends on. The install
      # directory is under RUNNER_TEMP and the build lands in a prefix this user
      # owns, so nothing it leaves behind can be mistaken for a tracked file and
      # nothing it does depends on a host this project does not control.
      # ⚠ The `package` route is privileged by construction and is NOT on that
      # path: `E-ACQ-01` wants two independent routes and `release` plus `source`
      # already are.
      # ⛔ AND THE ARTIFACT IS CHOSEN HERE, WHILE THE NETWORK IS IN REACH, WHICH IS
      # WHY THIS STEP EXISTS AT ALL. Every `release` route in this tree refuses without
      # `BIT_IDS_RELEASE_URL`, and until now nothing produced one: `resolve-stable`
      # orders versions and does not select an artifact. `resolve-release` reads
      # the repository, the version scheme and the asset pattern out of the
      # adapter's own `describe`, so this step carries no per-target knowledge and
      # needs no case over `matrix.adapter`.
      #
      # ⚠ THE PACKAGE LANE SKIPS IT because a package index needs no artifact
      # chosen, and a step that ran anyway would fetch a vendor listing that
      # nothing in that lane reads.
      # ⛔ AND THE SOURCE LANE NO LONGER SHARES IT. This step used to resolve for
      # both lanes, on the reasoning that one resolver is how absolute 4's
      # same-version rule is made true rather than checked. `E-ACQ-07` refuses
      # exactly that - two routes sharing a resolver are one route - and
      # `assemble-capture` measured it on run 14, whose two resolution records
      # differ only in their timestamps. ⭐ Absolute 4 checks version equality
      # AFTER installation, so two resolutions that disagree are a vendor that
      # moved between two reads and catching it is the point.
      - name: Resolve the release artifact
        if: matrix.route == 'release'
        env:
          ADAPTER: ${{ matrix.adapter }}
        run: |
          set -eu
          # ⛔ THE DIRECTORY IS MADE BEFORE THE REDIRECTION, NOT BY THE SCRIPT.
          # A shell opens `>` targets before it execs the command, so a workdir
          # created inside `resolve-release` is created too late for a redirect
          # into it and the step dies on the redirection rather than on anything
          # the script did.
          mkdir -p "$RUNNER_TEMP/release"
          "$BIT_CHECK" resolve-release \
            --adapter "$ADAPTER" \
            --workdir "$RUNNER_TEMP/release" \
            --record "$RUNNER_TEMP/release/resolution.txt" \
            >"$RUNNER_TEMP/release/url.txt"
          cat "$RUNNER_TEMP/release/resolution.txt"

      # ⭐ THE SOURCE LANE'S OWN RESOLUTION, FROM THE REPOSITORY'S OWN REFS.
      # `git ls-remote --tags` asks the repository what tags exist; a releases
      # listing asks an API what release OBJECTS were published, which is a
      # different and much smaller population - measured on 2026-09-05,
      # qbittorrent's releases endpoint answered with four entries where its tags
      # endpoint answered with at least a hundred. Two indexes that can disagree
      # about the newest version are two resolvers, which is what `E-ACQ-07`
      # compares and what makes this pair two routes.
      #
      # ⚠ IT RUNS OUTSIDE THE CAPTURE'S NAMESPACE, for the reason every fetch here
      # does: the namespace has no route, by design.
      - name: Resolve the source tag
        if: matrix.route == 'source'
        env:
          ADAPTER: ${{ matrix.adapter }}
        run: |
          set -eu
          # ⛔ THE DIRECTORY IS MADE BEFORE THE REDIRECTION, for the reason the
          # step above gives: a shell opens `>` targets before it execs.
          mkdir -p "$RUNNER_TEMP/source"
          "$BIT_CHECK" resolve-source \
            --adapter "$ADAPTER" \
            --workdir "$RUNNER_TEMP/source" \
            --record "$RUNNER_TEMP/source/resolution.txt" \
            >"$RUNNER_TEMP/source/tag.txt"
          cat "$RUNNER_TEMP/source/resolution.txt"

      # ⛔ THE BOUND IS A BUILD'S WHEN THE ROUTE COMPILES, WHATEVER IT IS CALLED.
      # Each adapter's `describe` names the routes that compile in `compiles`,
      # and the bounds below read this step's answer. They read the route's name
      # until 2026-10-14, which was right while only source routes built:
      # Transmission's release asset is a source tarball measured at 695 seconds,
      # and a release lane bounded at 420 would be killed half-way. `CLIENT-06`.
      - name: Read whether this route compiles
        id: bounds
        env:
          ADAPTER: ${{ matrix.adapter }}
          ROUTE: ${{ matrix.route }}
        run: |
          set -eu
          compiles=$("$BIT_CHECK" adapter "$ADAPTER" describe | awk -F= '$1 == "compiles" { print $2 }')
          case ",$compiles," in
            *",$ROUTE,"*) answer=true ;;
            *) answer=false ;;
          esac
          echo "the $ROUTE route compiles: $answer"
          echo "compiles=$answer" >>"$GITHUB_OUTPUT"

      # ⭐ THE INSTALL, UNPRIVILEGED AND BOUNDED, WITH ITS OUTPUT IN A FILE.
      # `bit-check install-step` runs `bit-check install-client` for this lane's route and
      # writes everything beneath it to `install-step.log`, which this shell prints
      # afterwards; nothing the product spawns can hold this step's output pipe,
      # which would keep a finished step open. `check-step-bodies` runs this body.
      #
      # ⚠ THE BOUNDS ARE FOR A ROUTE THAT REALLY RUNS LONG, NOT FOR A HANG. Runs 3
      # to 34 were read as this step hanging and most of what surrounds it was
      # built for that reading. It never hung: the next step cut the host's route
      # and the runner agent with it, measured on 2026-10-11 and recorded in
      # `TODO/ci.md` under `CI-08`. The capture is contained in a namespace now.
      - name: Install the client
        id: install
        env:
          ADAPTER: ${{ matrix.adapter }}
          ROUTE: ${{ matrix.route }}
          # ⚠ The route's own bound: 1500 seconds for a route that compiles and
          # 420 for everything else. 2.7.5 took 496 on a runner against 366 on the
          # session host of 2026-09-09. `v3.0.2`, whose superbuild compiles ten
          # dependencies first, took 870 on the session host of 2026-10-14, where
          # its failing build had reached the compile error in 588 against a
          # runner's 508.
          BIT_IDS_INSTALL_TIMEOUT: ${{ steps.bounds.outputs.compiles == 'true' && '1500' || '420' }}
          # ⚠ Each bound outlasts the one inside it: install-client's own bounds
          # sum to 630 seconds on a lane that downloads and 1710 on one that
          # compiles, under this, under OUTER_TIMEOUT, under the step's
          # `timeout-minutes`, under the job's.
          BIT_IDS_STEP_TIMEOUT: ${{ steps.bounds.outputs.compiles == 'true' && '1860' || '780' }}
          # ⛔ AN ENVIRONMENT VALUE, NOT AN EXPRESSION IN `run:`, because
          # `check-step-bodies` lifts that body and runs it as shell.
          OUTER_TIMEOUT: ${{ steps.bounds.outputs.compiles == 'true' && '1980' || '900' }}
        timeout-minutes: ${{ steps.bounds.outputs.compiles == 'true' && 35 || 17 }}
        # ⚠ `>file 2>&1 </dev/null` hands the whole subtree a regular file, and
        # the exit code is carried by hand because the last command is the `cat`.
        # `${OUTER_TIMEOUT:-1080}` keeps the line runnable outside a dispatch.
        # ⛔ `|| rc=$?`, NOT `rc=$?` ON THE NEXT LINE. The runner runs this body
        # as `bash -e`, so a failing install ended the shell on its own line and
        # the `cat` never ran: run 35's source lane failed to compile and its job
        # log printed none of it. `check-step-bodies` asks a refusal's output.
        # ⚠ When the outer `timeout` fires, `bit-check install-step` dies before it
        # prints its own step log, so a 124 here prints little; the install
        # artifact carries the rest.
        run: |
          set -u
          rc=0
          timeout -k 30 "${OUTER_TIMEOUT:-1080}" "$BIT_CHECK" install-step \
            >"$RUNNER_TEMP/install-step.log" 2>&1 </dev/null || rc=$?
          cat "$RUNNER_TEMP/install-step.log" || true
          exit "$rc"
        # ⚠ `bit-check install-step` is Go since 2026-10-15, `CI-11`; the body
        # it replaced was the shell script of the same name, now deleted.

      # ⛔ THE BARRIER, BECAUSE EACH ROUTE INSTALLS ON ITS OWN RUNNER. A run
      # manifest says the build was acquired twice before it was observed, and
      # run 37's release lane observed while the source route was still
      # compiling elsewhere. Settled by the operator on 2026-10-14: every lane's
      # capture waits for every route's install. `CI-09`, and
      # `bit-check install-barrier` (tools/check/installbarrier.go) says how
      # the runners meet. ⚠ Go since 2026-10-15, `CI-11`, because the Windows
      # lane below waits at it too; the shell script it replaced is deleted.
      # ⚠ Neither step fails the job: a route that cannot be satisfied fails its
      # own lane, and the others' measurements stay intact with a verdict that
      # says why their order is not proven.
      # ⛔ EVERY LANE ARRIVES, INSTALLED OR NOT. This read `always() &&
      # steps.install.outcome != 'skipped'` until 2026-10-14, so a lane that
      # failed BEFORE its install posted nothing, and the others waited out the
      # whole bound for it: `capture-client` run 38600252161's source lane
      # failed resolving its tag and the release lane sat at the barrier. A
      # skipped install arrives as `failure`, which ends every wait at once and
      # names the route. `CLIENT-06`.
      - name: Arrive at the install barrier
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BARRIER_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          BARRIER_ADAPTER: ${{ matrix.adapter }}
          ROUTE: ${{ matrix.route }}
          INSTALL_CONCLUSION: ${{ steps.install.outcome == 'success' && 'success' || 'failure' }}
        run: |
          rc=0
          "$BIT_CHECK" install-barrier arrive "$BARRIER_ADAPTER" "$ROUTE" "$INSTALL_CONCLUSION" || rc=$?
          [ "$rc" = 0 ] || echo "install-barrier: could not arrive (exit $rc); the other lanes will time out"

      - name: Wait at the install barrier
        if: steps.install.outcome == 'success'
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
          BARRIER_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          BARRIER_ADAPTER: ${{ matrix.adapter }}
          ROUTES: ${{ inputs.routes }}
        run: |
          rc=0
          "$BIT_CHECK" install-barrier wait "$BARRIER_ADAPTER" "$ROUTES" "$RUNNER_TEMP/install-barrier.txt" || rc=$?
          [ "$rc" = 0 ] || echo "install-barrier: could not wait (exit $rc); this capture's order is not proven"

      # ⛔ THE CAPTURE IS CONTAINED, NOT THE HOST. This workflow used to delete
      # the host's default routes here and put them back after the capture. The
      # runner agent reaches GitHub over those same routes, so from the cut on the
      # job could not report: on the images of 2026-09 onward it never came back,
      # and runs 21 to 34 each showed *Install the client* running forever with
      # no log and no artifact over a step that had finished in seconds. Measured
      # on 2026-10-11 by the flight recorder, whose posts stopped the instant
      # the route was cut and never resumed. ⭐ `bit-check contained` runs the
      # guard and the capture in a network namespace that holds loopback alone,
      # so the guard reads the namespace's own empty route table and the agent
      # never loses its link. It was a shell script until 2026-10-16, `CI-11`.
      - name: Assert containment
        run: |
          "$BIT_CHECK" contained -- "$BIT_CHECK" assert-disposable --egress

      # ⭐ AND HERE A PRODUCT THIS PROJECT DID NOT WRITE IS HANDED THE TORRENT.
      # It learns the tracker's address by reading the file, which is what a
      # stock build does with any torrent, so nothing about this run is a control
      # the product does not already have.
      - name: Capture
        id: capture
        env:
          RUN_ID: capture-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.adapter }}-${{ matrix.route }}
          SECONDS_TO_SERVE: ${{ inputs.seconds }}
          PEER_PORT: ${{ inputs.peer_port }}
          ADAPTER: ${{ matrix.adapter }}
        run: |
          "$BIT_CHECK" contained -- "$BIT_CHECK" capture-client \
            --run-id "$RUN_ID" \
            --out "$RUNNER_TEMP/capture" \
            --observer "$GITHUB_WORKSPACE/target/debug/examples/client-capture" \
            --adapter "$ADAPTER" \
            --connector scripts/capture/connectors/cpython-stdlib.py \
            --peer-port "$PEER_PORT" \
            --seconds "$SECONDS_TO_SERVE"

      # ⛔ A CAPTURE THAT REFUSED IS EVIDENCE TOO, AND RULE 12 IS ASKED OF IT
      # FIRST. The two contained runs of 2026-10-11 refused in the connector and
      # the upload below ran on success only, so their transcripts were destroyed
      # with the hosts and a job log was all that survived. ⚠ `bit-check capture-client`
      # scans its output on its success path alone, and a refusal is exactly the
      # run whose adapter `stop` - which unlinks a product's RPC token - may never
      # have been reached. So the scan runs here, and the upload follows only a
      # success or a scan that passed.
      - name: Scan the evidence of a refused capture
        id: scan
        if: failure() && steps.capture.outcome == 'failure'
        run: |
          "$BIT_CHECK" scan-bundle "$RUNNER_TEMP/capture"

      # ⚠ ONLY AFTER THE MEASUREMENT IS FINISHED. The host never lost its route,
      # so nothing has to be restored first.
      - name: Upload the evidence bundle
        if: always() && (steps.capture.outcome == 'success' || steps.scan.outcome == 'success')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capture-client-${{ matrix.adapter }}-${{ matrix.route }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/capture
            ${{ runner.temp }}/install-${{ matrix.route }}.txt
          if-no-files-found: error
          retention-days: 90

      # ⛔ THE INSTALL'S OWN LOGS GO UP WHETHER OR NOT ANYTHING BEFORE THIS
      # WORKED, and `if: always()` is what makes that true from here rather than
      # from before the capture. It sat between the install and the route cut for
      # four dispatches, on the reasoning that a job which never reached the
      # capture would otherwise upload nothing - and an `always()` step at the end
      # of the job runs after a failed step too, so the early position bought
      # nothing that this one does not.
      #
      # ⚠ The step that "hung" here on run 6 was the route cut reaching the
      # runner agent, not this upload; the comment on *Assert containment* says
      # what was measured.
      #
      # ⚠ if-no-files-found is `warn` rather than `error`: a job that failed
      # before the workdir existed has nothing to upload, and failing this step
      # would replace one missing diagnosis with another. ⛔ `continue-on-error`
      # is deliberate here and nowhere else - this upload is a diagnostic aid and
      # the evidence bundle above stays fatal.
      #
      # ⛔ LOGS AND RECORDS, NAMED, RATHER THAN THE WHOLE WORKDIR. A source-build
      # route unpacks a tarball and compiles it *in* that workdir, so uploading
      # the directory uploads a build tree: measured on run 5, 42.6 megabytes and
      # 1867 entries for a step called *Upload the install logs*. ⚠ The package
      # route's workdir happens to hold two log files, which is why the directory
      # form looked right for four dispatches.
      - name: Upload the install logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-${{ matrix.adapter }}-${{ matrix.route }}-${{ github.run_id }}-${{ github.run_attempt }}
          # ⛔ THE SOURCE ROUTE'S RESOLUTION SHIPS TOO, AND IT DID NOT UNTIL
          # 2026-09-15. This list named `release/` alone, which was complete for
          # as long as the source lane resolved through the release listing -
          # which is exactly what `E-ACQ-07` refused run 14 for. ⚠ The moment
          # that was repaired, *Resolve the source tag* began writing
          # `$RUNNER_TEMP/source/resolution.txt` and nothing carried it off the
          # runner, so run 16 uploaded two green lanes and `assemble-capture`
          # refused with *the source route has no resolution*.
          #
          # ⚠ Top-level globs, no `**`, for the reason this step's comment above
          # gives and `install-client`'s rule-12 scan now depends on: a `*` does
          # not descend, so a resolver workdir that ever held a clone would not
          # ship it.
          #
          # ⭐ AND THE ROOTLESS INSTALLER'S OWN REPORT SHIPS, WHICH IS WHERE THE
          # ARTIFACT'S DIGEST AND ITS DISPOSITION ARE WRITTEN. `ACQ-06`. ⚠ It is
          # a `.txt` at the workdir's top level, so `install-client`'s rule-12
          # scan - which reads EVERY file at that level - is still wider than
          # what this ships.
          path: |
            ${{ runner.temp }}/install-${{ matrix.route }}/*.log
            ${{ runner.temp }}/install-${{ matrix.route }}/*.err
            ${{ runner.temp }}/install-${{ matrix.route }}/*.txt
            ${{ runner.temp }}/install-${{ matrix.route }}.txt
            ${{ runner.temp }}/install-step.log
            ${{ runner.temp }}/install-barrier.txt
            ${{ runner.temp }}/release/*.txt
            ${{ runner.temp }}/release/*.json
            ${{ runner.temp }}/release/*.err
            ${{ runner.temp }}/source/*.txt
            ${{ runner.temp }}/source/*.json
            ${{ runner.temp }}/source/*.err
          if-no-files-found: warn
          retention-days: 30

      # ⚠ A FINGERPRINT IS COMPARABLE ONLY AGAINST ONE THE SAME HALF PRODUCED,
      # and on Linux a repeat really does mean a survived host.
      - name: Report the host fingerprint
        if: always()
        env:
          ROUTE: ${{ matrix.route }}
        run: |
          set -eu
          print=$("$BIT_CHECK" assert-disposable --fingerprint)
          echo "linux host fingerprint: $print"
          {
            echo "### ${{ matrix.adapter }} (${{ matrix.route }})"
            echo
            echo "host fingerprint \`$print\`"
            echo
            echo 'Compare against the previous **Linux** run. A repeat means the host was not destroyed.'
            echo
            echo '```'
            cat "$RUNNER_TEMP/release/resolution.txt" 2>/dev/null || echo 'no release resolution'
            echo '```'
            echo
            echo '```'
            cat "$RUNNER_TEMP/install-$ROUTE.txt" 2>/dev/null || echo 'no install record'
            echo '```'
            echo
            echo '```'
            cat "$RUNNER_TEMP/capture/attestation.txt" 2>/dev/null || echo 'no attestation'
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # ⛔ LAST, AND IT CLOSES THE RECORDER'S CHECK RUN, which nothing did until
      # 2026-10-14: the recorder ran to a limit no job reaches and was killed with
      # the job, so every check run it opened stayed `in_progress` and a host that
      # ended in contact read exactly like one that lost it. ⭐ A run still open
      # after its job is now a host that never reached this step.
      # ⚠ IT NEVER FAILS THE JOB. The recorder is a diagnostic, so a run it did not
      # confirm says so in the log and the step still ends 0; the wait is bounded
      # on the done file the recorder writes after reading its answer back.
      - name: Stop the flight recorder
        if: always()
        run: |
          set -u
          touch "$RUNNER_TEMP/flight-recorder.stop"
          if timeout 60 sh -c 'until [ -e "$1" ]; do sleep 1; done' sh "$RUNNER_TEMP/flight-recorder.done"; then
            cat "$RUNNER_TEMP/flight-recorder.done"
          else
            echo 'the flight recorder did not confirm within 60s; its check run may still be open'
          fi
          cat "$RUNNER_TEMP/flight-recorder.log" 2>/dev/null || true
          exit 0

  # ⭐ THE WINDOWS LANE, `CI-11`: the same capture path as the Linux job, step
  # for step, in `bit-check` and PowerShell because a Windows runner has no
  # `sh`. The adapter is the Go one, `bit-check adapter qbittorrent`, named by
  # its registered name rather than a path.
  #
  # ⛔ CONTAINED AT THE FIREWALL, AS capture.yml's WINDOWS JOB IS. Windows has no
  # network namespace, and cutting the host's route severs the runner agent
  # (`CI-08`). So every program the capture runs gets an outbound block rule,
  # the guard reads the rules back, and the capture's own blocked program
  # proves the host enforces them. ⭐ The list is `bit-check capture-client
  # --programs`, the one derivation: the observer, `bit-check` (which runs the
  # adapter and the capture), the installed `qbittorrent.exe` and the
  # connector's interpreter. Every step that writes, reads or proves the rules
  # asks it, and the capture asks the guard again over the same list.
  #
  # ⚠ NO FLIGHT RECORDER HERE. `bit-check flight-recorder` reads `/proc`
  # and stays Linux-only; this lane never cuts its route, which is what the
  # recorder was built to see through, so the job log reaches GitHub whole.
  windows:
    name: Windows client capture (${{ matrix.adapter }}, ${{ matrix.route }})
    if: inputs.windows_adapters != '[]'
    runs-on: windows-2025
    # ⚠ Nothing on this lane compiles, so the bound is a download lane's with
    # room for winget, whose first call also refreshes its index, or for Scoop,
    # which is installed and clones its bucket first.
    timeout-minutes: 45
    # ⛔ READ ONLY, with `checks: write` for the install barrier's check runs.
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        adapter: ${{ fromJSON(inputs.windows_adapters) }}
        route: ${{ fromJSON(inputs.windows_routes) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ⭐ `bit-check` FIRST, BECAUSE THE CLAIM IS ONE OF ITS COMMANDS, as on
      # Linux. It is also the adapter, the barrier and the prover on this lane.
      - name: Build bit-check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $out = Join-Path $env:RUNNER_TEMP 'bit-check.exe'
          Push-Location tools/check
          & go build -o $out .
          $rc = $LASTEXITCODE
          Pop-Location
          if ($rc -ne 0) { exit 1 }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "BIT_CHECK=$out"
          exit 0

      # ⛔ FIRST, BEFORE ANYTHING ELSE WRITES TO THE HOST, and before anything is
      # installed. On Windows `bit-check assert-disposable` asks
      # assert-disposable.ps1, whose marker is under ProgramData.
      - name: Claim the host
        shell: pwsh
        env:
          RUN_ID: capture-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.adapter }}-windows-${{ matrix.route }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & $env:BIT_CHECK assert-disposable --claim $env:RUN_ID
          $rc = $LASTEXITCODE
          exit $rc

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup show active-toolchain

      # ⛔ THE BUILD HAPPENS HERE, WHILE THE NETWORK STILL EXISTS, and it is every
      # binary this job runs: the observer and both resolver examples.
      - name: Build the observer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & cargo build -p bit-ids-probe --locked --example client-capture
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & cargo build -p bit-ids --locked --example resolve-stable --example select-asset
          if ($LASTEXITCODE -ne 0) { exit 1 }
          exit 0

      # ⛔ THE ARTIFACT IS CHOSEN HERE, out of the adapter's own `describe`, which
      # names qBittorrent's `_lt20` installer, Transmission's x64 MSI or
      # aria2-next's x64 executable. ⚠ The URL is written with a bare `\n`
      # rather than through `>`, which on Windows would end it with `\r\n` and
      # hand `install-rootless` a URL with a carriage return in it.
      - name: Resolve the release artifact
        if: matrix.route == 'release'
        shell: pwsh
        env:
          ADAPTER: ${{ matrix.adapter }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $dir = Join-Path $env:RUNNER_TEMP 'release'
          $null = New-Item -ItemType Directory -Force -Path $dir
          $url = & $env:BIT_CHECK resolve-release --adapter $env:ADAPTER --workdir $dir --record (Join-Path $dir 'resolution.txt')
          if ($LASTEXITCODE -ne 0) { exit 1 }
          [System.IO.File]::WriteAllText((Join-Path $dir 'url.txt'), ((@($url) -join '') + "`n"))
          Get-Content -LiteralPath (Join-Path $dir 'resolution.txt')
          exit 0

      # ⭐ THE INSTALL, BOUNDED, WITH ITS OUTPUT IN FILES. `bit-check
      # install-step` runs the install in a JOB OBJECT, so everything the route
      # starts is swept when it ends. ⛔ AND THIS STEP BOUNDS THAT PROCESS FROM
      # OUTSIDE IT, as `timeout -k 30` does on Linux: Windows' `timeout.exe` is
      # a pause, not a bound, so the outer bound is `WaitForExit` and a kill of
      # the whole tree. ⚠ Each bound outlasts the one inside it: install-client's
      # own bounds sum to about 930 seconds, under BIT_IDS_STEP_TIMEOUT, under
      # OUTER_TIMEOUT, under the step's `timeout-minutes`, under the job's.
      # ⚠ The version bound is 120 seconds, not 60, because qBittorrent's build
      # is asked its version by starting it and reading its Web UI.
      - name: Install the client
        id: install
        shell: pwsh
        env:
          ADAPTER: ${{ matrix.adapter }}
          ROUTE: ${{ matrix.route }}
          BIT_IDS_INSTALL_TIMEOUT: "600"
          BIT_IDS_VERSION_TIMEOUT: "120"
          BIT_IDS_STEP_TIMEOUT: "1080"
          OUTER_TIMEOUT: "1200"
        timeout-minutes: 22
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $log = Join-Path $env:RUNNER_TEMP 'install-step.log'
          $err = Join-Path $env:RUNNER_TEMP 'install-step.err'
          # ⚠ An empty file for stdin, so a prompt anywhere beneath gets end of
          # file rather than a wait.
          $in = Join-Path $env:RUNNER_TEMP 'install-step.in'
          $null = New-Item -ItemType File -Force -Path $in
          $p = Start-Process -FilePath $env:BIT_CHECK -ArgumentList 'install-step' -NoNewWindow -PassThru `
            -RedirectStandardOutput $log -RedirectStandardError $err -RedirectStandardInput $in
          # ⚠ The handle is read at once: a process object whose handle was never
          # opened reports no exit code once the process has gone.
          $null = $p.Handle
          if ($p.WaitForExit([int]$env:OUTER_TIMEOUT * 1000)) {
            $rc = $p.ExitCode
          }
          else {
            $p.Kill($true)
            $rc = 124
            [Console]::Error.WriteLine("install-step was still running after $($env:OUTER_TIMEOUT)s and was ended with its tree")
          }
          Get-Content -LiteralPath $log -ErrorAction SilentlyContinue
          Get-Content -LiteralPath $err -ErrorAction SilentlyContinue
          exit $rc

      # ⛔ THE BARRIER, AS ON LINUX, AND THIS LANE'S ROUTES MEET EACH OTHER. The
      # Windows pair is its own run manifest, so it arrives under
      # `<adapter>-windows` and never satisfies, or waits on, a Linux lane.
      # ⛔ EVERY LANE ARRIVES, INSTALLED OR NOT.
      - name: Arrive at the install barrier
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BARRIER_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          BARRIER_ADAPTER: ${{ matrix.adapter }}-windows
          ROUTE: ${{ matrix.route }}
          INSTALL_CONCLUSION: ${{ steps.install.outcome == 'success' && 'success' || 'failure' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & $env:BIT_CHECK install-barrier arrive $env:BARRIER_ADAPTER $env:ROUTE $env:INSTALL_CONCLUSION
          if ($LASTEXITCODE -ne 0) { Write-Output "install-barrier: could not arrive (exit $LASTEXITCODE); the other lanes will time out" }
          exit 0

      - name: Wait at the install barrier
        if: steps.install.outcome == 'success'
        timeout-minutes: 30
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BARRIER_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          BARRIER_ADAPTER: ${{ matrix.adapter }}-windows
          ROUTES: ${{ inputs.windows_routes }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & $env:BIT_CHECK install-barrier wait $env:BARRIER_ADAPTER $env:ROUTES (Join-Path $env:RUNNER_TEMP 'install-barrier.txt')
          if ($LASTEXITCODE -ne 0) { Write-Output "install-barrier: could not wait (exit $LASTEXITCODE); this capture's order is not proven" }
          exit 0

      # ⛔ THE ROUTE IS NEVER CUT ON THIS HOST. Every program the capture runs
      # gets an outbound block rule and the host keeps its own way out, the
      # runner agent's included. ⭐ The list is asked of `bit-check
      # capture-client --programs`, after the install, because the product's
      # executable is on it and does not exist before.
      - name: Contain the capture's programs
        shell: pwsh
        env:
          OBSERVER: ${{ github.workspace }}\target\debug\examples\client-capture.exe
          ADAPTER: ${{ matrix.adapter }}
          CONNECTOR: scripts/capture/connectors/cpython-stdlib.py
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $programs = @(& $env:BIT_CHECK capture-client --programs --observer $env:OBSERVER --adapter $env:ADAPTER --connector $env:CONNECTOR)
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & pwsh -NoProfile -File ./scripts/capture/firewall-contain.ps1 -Program ($programs -join '|')
          if ($LASTEXITCODE -ne 0) { exit 1 }
          exit 0

      - name: Assert containment
        shell: pwsh
        env:
          OBSERVER: ${{ github.workspace }}\target\debug\examples\client-capture.exe
          ADAPTER: ${{ matrix.adapter }}
          CONNECTOR: scripts/capture/connectors/cpython-stdlib.py
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $programs = @(& $env:BIT_CHECK capture-client --programs --observer $env:OBSERVER --adapter $env:ADAPTER --connector $env:CONNECTOR)
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $env:BIT_CHECK assert-disposable --egress --program ($programs -join '|')
          if ($LASTEXITCODE -ne 0) { exit 1 }
          exit 0

      # ⭐ AND THIS IS WHAT NO READING OF THE RULES CAN ESTABLISH: that the host
      # enforces them. The capture's own blocked `bit-check` tries to leave with
      # `probe-egress`, which passes only on a connection this host refused - a
      # name that does not resolve or a dial that times out is something else
      # failing - and the host itself reaching the same address is the control.
      # ⚠ `bit-check` is the prover because it is the program on the list that
      # can be asked to try; it has to BE on the list, and this step checks so.
      - name: Prove the firewall blocks
        shell: pwsh
        env:
          OBSERVER: ${{ github.workspace }}\target\debug\examples\client-capture.exe
          ADAPTER: ${{ matrix.adapter }}
          CONNECTOR: scripts/capture/connectors/cpython-stdlib.py
          PROBE_HOST: api.github.com:443
          PROBE_URL: https://api.github.com/zen
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $programs = @(& $env:BIT_CHECK capture-client --programs --observer $env:OBSERVER --adapter $env:ADAPTER --connector $env:CONNECTOR)
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $self = [System.IO.Path]::GetFullPath($env:BIT_CHECK)
          $listed = @($programs | Where-Object { [string]::Equals([System.IO.Path]::GetFullPath($_), $self, [System.StringComparison]::OrdinalIgnoreCase) })
          if ($listed.Count -ne 1) {
            [Console]::Error.WriteLine('bit-check is not on the capture''s program list, so it cannot prove the block')
            exit 1
          }
          & $env:BIT_CHECK probe-egress $env:PROBE_HOST
          $blocked = $LASTEXITCODE
          if ($blocked -ne 0) {
            [Console]::Error.WriteLine("the blocked bit-check was not refused by this host (probe-egress exit $blocked)")
            exit 1
          }
          try {
            # ⚠ ANY HTTP ANSWER IS A REACHED HOST: a 403 or a 404 still came
            # from the address, and api.github.com rate-limits a shared runner's
            # unauthenticated calls. capture-client run 38829879023 failed its
            # control on one. Only a connection that never forms is refused here.
            $null = Invoke-WebRequest -Uri $env:PROBE_URL -UseBasicParsing -TimeoutSec 20 -SkipHttpErrorCheck
          }
          catch {
            [Console]::Error.WriteLine('the host itself cannot reach the address, so the refusal proves nothing: ' + $_.Exception.Message)
            exit 1
          }
          Write-Output ('blocked: ' + $self + ' was refused; the host itself reached ' + $env:PROBE_URL)
          exit 0

      # ⭐ AND HERE A PRODUCT THIS PROJECT DID NOT WRITE IS HANDED THE TORRENT,
      # with its programs blocked and the guard asked again over the same list.
      - name: Capture
        id: capture
        shell: pwsh
        env:
          RUN_ID: capture-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.adapter }}-windows-${{ matrix.route }}
          SECONDS_TO_SERVE: ${{ inputs.seconds }}
          PEER_PORT: ${{ inputs.peer_port }}
          OBSERVER: ${{ github.workspace }}\target\debug\examples\client-capture.exe
          ADAPTER: ${{ matrix.adapter }}
          CONNECTOR: scripts/capture/connectors/cpython-stdlib.py
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & $env:BIT_CHECK capture-client --run-id $env:RUN_ID --out (Join-Path $env:RUNNER_TEMP 'capture') --observer $env:OBSERVER --adapter $env:ADAPTER --connector $env:CONNECTOR --peer-port $env:PEER_PORT --seconds $env:SECONDS_TO_SERVE
          $rc = $LASTEXITCODE
          exit $rc

      # ⛔ A CAPTURE THAT REFUSED IS EVIDENCE TOO, AND RULE 12 IS ASKED OF IT
      # FIRST, as on Linux.
      - name: Scan the evidence of a refused capture
        id: scan
        if: failure() && steps.capture.outcome == 'failure'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & $env:BIT_CHECK scan-bundle (Join-Path $env:RUNNER_TEMP 'capture')
          $rc = $LASTEXITCODE
          exit $rc

      - name: Upload the evidence bundle
        if: always() && (steps.capture.outcome == 'success' || steps.scan.outcome == 'success')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capture-client-${{ matrix.adapter }}-windows-${{ matrix.route }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/capture
            ${{ runner.temp }}/install-${{ matrix.route }}.txt
          if-no-files-found: error
          retention-days: 90

      # ⚠ Logs and records, named, at the top level of each directory, for the
      # reasons the Linux job's step gives. ⛔ `continue-on-error` here and
      # nowhere else: this upload is a diagnostic aid.
      - name: Upload the install logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-${{ matrix.adapter }}-windows-${{ matrix.route }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/install-${{ matrix.route }}/*.log
            ${{ runner.temp }}/install-${{ matrix.route }}/*.err
            ${{ runner.temp }}/install-${{ matrix.route }}/*.txt
            ${{ runner.temp }}/install-${{ matrix.route }}.txt
            ${{ runner.temp }}/install-step.log
            ${{ runner.temp }}/install-step.err
            ${{ runner.temp }}/install-barrier.txt
            ${{ runner.temp }}/release/*.txt
            ${{ runner.temp }}/release/*.json
            ${{ runner.temp }}/release/*.err
          if-no-files-found: warn
          retention-days: 30

      # ⛔ THIS FINGERPRINT IS NOT A FRESHNESS SIGNAL, for the reason capture.yml's
      # Windows job gives: on a cloned image it identifies the image. The claim
      # is what refuses a survived host.
      - name: Report the host fingerprint
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $print = @(& $env:BIT_CHECK assert-disposable --fingerprint)
          $rc = $LASTEXITCODE
          Write-Output "windows host fingerprint: $print"
          $body = New-Object System.Collections.ArrayList
          [void]$body.Add('### ${{ matrix.adapter }} on Windows (${{ matrix.route }})')
          [void]$body.Add('')
          [void]$body.Add('host fingerprint `' + ($print -join '') + '` - this identifies the runner IMAGE, not the host')
          foreach ($file in @('release/resolution.txt', 'install-${{ matrix.route }}.txt', 'capture/attestation.txt')) {
            [void]$body.Add('')
            [void]$body.Add('```')
            $path = Join-Path $env:RUNNER_TEMP $file
            if (Test-Path -LiteralPath $path) { $body.AddRange(@(Get-Content -LiteralPath $path)) } else { [void]$body.Add("no $file") }
            [void]$body.Add('```')
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $body
          if ($rc -ne 0) { Write-Output "the fingerprint could not be read (exit $rc)" }
          exit 0
