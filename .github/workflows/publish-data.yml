name: Publish data

# ⛔ THERE IS NO AUTOMATIC TRIGGER AND THAT IS THE POINT OF THIS FILE'S SHAPE.
# Nothing in this repository has ever been published. The first measured pair
# exists since 2026-10-14, and what reaches the data branch is a person's call
# on a bundle they named, not a merge's or a clock's. So a human has to dispatch
# it, and `dry_run` defaults to true so that dispatching it by accident still
# pushes nothing. scripts/ci/check-workflow.sh asserts both.
on:
  workflow_dispatch:
    inputs:
      bundle_run_id:
        description: Run id of the assemble-bundle dispatch whose artifact carries the bundle
        required: true
        type: string
      dry_run:
        description: Do everything except the push and the read-back
        required: true
        default: true
        type: boolean

permissions:
  contents: read

# ⛔ NEVER CANCELLED IN FLIGHT, unlike CI. Cancelling a gate run costs a rerun;
# cancelling a publisher between its append comparison and its read-back leaves
# a branch nobody has verified. Two dispatches queue instead, and the second is
# refused by git as a non-fast-forward if the first has moved the branch.
concurrency:
  group: publish-data
  cancel-in-progress: false

jobs:
  publish:
    name: Append to the data branch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The one job in this repository that may write. `actions: read` is what
    # lets it reach the bundle artifact of another run and nothing else.
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download the assembled bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # ⭐ `assemble-bundle.yml` PRODUCES IT, since 2026-10-14. That workflow
        # reads one `capture-client` dispatch's artifacts, writes the records
        # and their run manifests, and composes the publication.
        # ⚠ This was absent on purpose while every record in the store was
        # synthetic; the first measured pair is what it waited for. `CI-09`.
        with:
          name: bundle
          path: bundle
          run-id: ${{ inputs.bundle_run_id }}
          github-token: ${{ github.token }}
      # ⭐ A reader this project did not write, run before anything is pushed.
      # The publisher verifies the branch it fetched back; this verifies the
      # bundle it was handed, which is a different claim and the earlier one.
      - name: Verify the bundle against its own checksums
        working-directory: bundle
        run: sha256sum -c SHA256SUMS
      # ⛔ THE TOKEN GOES IN A HEADER AND NEVER IN A URL. The publisher builds a
      # scratch clone of its own, so the checkout's local credentials do not
      # reach it and something has to authorize the push globally. A credential
      # written into the remote URL would be visible to anything listing
      # processes, and it is the shape check-no-secrets refuses in this tree; it
      # refused the first version of this step. This is how actions/checkout
      # authenticates its own fetches.
      - name: Authorize the push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
      - name: Append to the data branch
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          REMOTE: https://github.com/${{ github.repository }}
        run: |
          set -eu
          if [ "$DRY_RUN" = "true" ]; then
            sh scripts/publishing/publish-data.sh --bundle bundle --remote "$REMOTE" --dry-run
          else
            sh scripts/publishing/publish-data.sh --bundle bundle --remote "$REMOTE"
          fi
