name: Capture

# ⛔ THERE IS NO `pull_request` TRIGGER AND THAT ABSENCE IS THE FORK GUARD.
# A fork cannot cause a workflow to run in the base repository, so there is no
# job-level condition here for anyone to weaken and no `if:` to get subtly
# wrong. The protection is structural. ⚠ An absence is exactly what a later edit
# restores without anybody noticing, which is why scripts/ci/check-workflow.sh
# asserts it as a case rather than this file asserting it as a comment.
#
# ⛔ AND NO `push` OR `schedule` EITHER. This job installs nothing today, but it
# is the file a client installer lands in, and a capture host is a machine whose
# capture programs are walled off from the network. Neither is something a merge
# should be able to start.
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: How long the observer serves before its own deadline stops it
        required: true
        default: "20"
        type: string

permissions:
  contents: read

# ⛔ NEVER CANCELLED IN FLIGHT. A cancellation after the claim leaves the marker
# written and the evidence unuploaded, so the host is spent and its capture is
# lost. Neither job cuts the host's route any more: the Linux job contains its
# capture in a namespace and the Windows job blocks the capture's programs at
# the firewall, so the runner keeps its way to GitHub throughout. Two dispatches
# queue instead.
concurrency:
  group: capture
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux capture
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # ⛔ READ ONLY. A capture produces an artifact and never a commit. The
    # publisher is the one job in this repository that may write, and it is a
    # separate workflow a human has to dispatch.
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ⭐ `bit-check` FIRST, BECAUSE THE CLAIM IS ONE OF ITS COMMANDS. The guard
      # is `bit-check assert-disposable` since 2026-10-15, `CI-11`. ⚠ This writes
      # this project's own binary into RUNNER_TEMP before the claim, which is
      # not a product's state: the claim's marker is what a survived host
      # carries, and this build leaves none.
      - name: Build bit-check
        run: |
          set -eu
          (cd tools/check && go build -o "$RUNNER_TEMP/bit-check" .)
          printf 'BIT_CHECK=%s\n' "$RUNNER_TEMP/bit-check" >>"$GITHUB_ENV"

      # ⛔ FIRST, BEFORE ANYTHING ELSE WRITES TO THE HOST. The claim refuses a
      # host that already ran a capture, and it can only tell by finding its own
      # marker. A step that ran earlier and left state behind would not be
      # detected; a claim that ran later would be a report rather than a
      # boundary.
      - name: Claim the host
        env:
          RUN_ID: capture-${{ github.run_id }}-${{ github.run_attempt }}-linux
        run: |
          "$BIT_CHECK" assert-disposable --claim "$RUN_ID"

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      # ⛔ THE BUILD HAPPENS HERE, WHILE THE NETWORK STILL EXISTS. After the next
      # step nothing can be fetched, and a capture that discovered a missing
      # crate under containment would have to restore egress to fix it - on a
      # host that exists to have no egress. `bit-check capture-run` refuses to build,
      # so this order is enforced rather than remembered.
      - name: Build the observer
        run: cargo build -p bit-ids-lab --locked --example evidence-bundle

      # ⛔ CONTAINED IN A NETWORK NAMESPACE, NOT BY CUTTING THE HOST'S ROUTE.
      # This job deleted the runner's default routes and restored them after the
      # capture until 2026-10-14. `capture-client` measured on 2026-10-11 that
      # the same cut severs the runner agent from GitHub, which is what ran
      # thirty-two dispatches into the ground; `bit-check contained` gives the
      # guard and the capture a namespace with loopback alone, and the host
      # keeps its route throughout. `CI-08`. ⚠ Windows has no namespace to run
      # a process in, so the Windows job below blocks the capture's programs at
      # the firewall instead, and never cuts either.
      #
      # ⛔ THE GUARD MUST PASS, AND IT READS THE KERNEL OF THE NAMESPACE THE
      # CAPTURE RUNS IN, which is the routing table that matters.
      - name: Assert containment
        run: |
          "$BIT_CHECK" contained -- "$BIT_CHECK" assert-disposable --egress

      - name: Capture
        env:
          RUN_ID: capture-${{ github.run_id }}-${{ github.run_attempt }}-linux
          SECONDS_TO_SERVE: ${{ inputs.seconds }}
        run: |
          "$BIT_CHECK" contained -- "$BIT_CHECK" capture-run \
            --run-id "$RUN_ID" \
            --out "$RUNNER_TEMP/capture" \
            --observer "$GITHUB_WORKSPACE/target/debug/examples/evidence-bundle" \
            --seconds "$SECONDS_TO_SERVE"

      # ⛔ if-no-files-found IS `error`. An upload that found nothing and exited
      # 0 is the "step that exits 0 having done nothing it was asked to do" row
      # in docs/conventions/forbidden-patterns.md, and it would leave a green
      # capture run with no evidence anywhere.
      - name: Upload the evidence bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capture-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capture
          if-no-files-found: error
          retention-days: 90

      # ⚠ A FINGERPRINT IS COMPARABLE ONLY AGAINST ONE THE SAME HALF PRODUCED.
      # The two guards digest different inputs, so this is compared against the
      # PREVIOUS LINUX capture's, never against the Windows job's below.
      #
      # ⭐ ON LINUX A REPEAT REALLY DOES MEAN A SURVIVED HOST, and CI-06 measured
      # it: capture runs 1 and 2 reported different fingerprints here.
      # ⛔ The Windows job's does NOT, and its own step says so. Read that one.
      - name: Report the host fingerprint
        run: |
          set -eu
          print=$("$BIT_CHECK" assert-disposable --fingerprint)
          echo "linux host fingerprint: $print"
          {
            echo "### Linux capture"
            echo
            echo "host fingerprint \`$print\`"
            echo
            echo 'Compare against the previous **Linux** run. A repeat means the host was not destroyed.'
            echo
            echo '```'
            cat "$RUNNER_TEMP/capture/attestation.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows capture
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Claim the host
        shell: pwsh
        env:
          RUN_ID: capture-${{ github.run_id }}-${{ github.run_attempt }}-windows
        run: ./scripts/acquisition/assert-disposable.ps1 -Claim -RunId $env:RUN_ID

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup show active-toolchain

      - name: Build the observer
        shell: pwsh
        run: cargo build -p bit-ids-lab --locked --example evidence-bundle

      # ⛔ THE ROUTE IS NEVER CUT ON THIS HOST. Cutting the default routes
      # severed runners from GitHub for good on the images of 2026-09 onward
      # (`TODO/ci.md`, `CI-08`), and Windows has no network namespace to run the
      # capture in instead. So every executable the capture runs gets an
      # outbound block rule and the host keeps its own way out. ⭐ The list is
      # asked of capture-run.ps1, which is the only derivation of it, so what
      # is blocked and what runs are one list.
      - name: Contain the capture's programs
        shell: pwsh
        env:
          OBSERVER: ${{ github.workspace }}/target/debug/examples/evidence-bundle.exe
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $programs = @(& pwsh -NoProfile -File ./scripts/capture/capture-run.ps1 -Programs -Observer $env:OBSERVER)
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & pwsh -NoProfile -File ./scripts/capture/firewall-contain.ps1 -Program ($programs -join '|')
          if ($LASTEXITCODE -ne 0) { exit 1 }
          exit 0

      - name: Assert containment
        shell: pwsh
        env:
          OBSERVER: ${{ github.workspace }}/target/debug/examples/evidence-bundle.exe
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $programs = @(& pwsh -NoProfile -File ./scripts/capture/capture-run.ps1 -Programs -Observer $env:OBSERVER)
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & pwsh -NoProfile -File ./scripts/acquisition/assert-disposable.ps1 -Egress -Program ($programs -join '|')
          if ($LASTEXITCODE -ne 0) { exit 1 }
          exit 0

      # ⭐ AND THIS IS WHAT NO READING OF THE RULES CAN ESTABLISH: that the host
      # enforces them. The guard above reads the active store; this has the
      # capture's own blocked driver try to leave, and has the host itself reach
      # the same address as the control. ⛔ Only `curl` exit 7, could not
      # connect, is a block. A DNS failure or a timeout is something else
      # failing, and calling it the block would pass a firewall that never
      # refused anything. ⚠ The address is GitHub's, which this runner talks to
      # throughout; nothing installed by this project runs before this step.
      - name: Prove the firewall blocks
        shell: pwsh
        env:
          OBSERVER: ${{ github.workspace }}/target/debug/examples/evidence-bundle.exe
          PROBE_URL: https://api.github.com/zen
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $programs = @(& pwsh -NoProfile -File ./scripts/capture/capture-run.ps1 -Programs -Observer $env:OBSERVER)
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $driver = @($programs | Where-Object { [System.IO.Path]::GetFileName($_) -ieq 'curl.exe' })
          if ($driver.Count -ne 1) {
            [Console]::Error.WriteLine('the capture names no curl.exe driver to prove the block with')
            exit 1
          }
          & $driver[0] -sS --noproxy '*' --max-time 20 -o "$env:RUNNER_TEMP/zen" $env:PROBE_URL
          $blocked = $LASTEXITCODE
          if ($blocked -ne 7) {
            [Console]::Error.WriteLine("the blocked driver did not fail to connect (curl exit $blocked)")
            exit 1
          }
          try {
            # ⚠ ANY HTTP ANSWER IS A REACHED HOST: a 403 or a 404 still came
            # from the address, and api.github.com rate-limits a shared runner's
            # unauthenticated calls. capture-client run 38829879023 failed its
            # control on one. Only a connection that never forms is refused here.
            $null = Invoke-WebRequest -Uri $env:PROBE_URL -UseBasicParsing -TimeoutSec 20 -SkipHttpErrorCheck
          }
          catch {
            [Console]::Error.WriteLine('the host itself cannot reach the address, so the refusal proves nothing: ' + $_.Exception.Message)
            exit 1
          }
          Write-Output ('blocked: ' + $driver[0] + ' could not connect (exit 7); the host itself could')
          exit 0

      # ⭐ AND THIS IS THE ONE THING NO FIXTURE CAN ESTABLISH. check-runner.ps1
      # proves the guard's logic against files of firewall state; that the real
      # cmdlets' output matches those fixtures is only ever established by the
      # steps above running with no -FirewallState on a real Windows host.
      - name: Capture
        shell: pwsh
        env:
          RUN_ID: capture-${{ github.run_id }}-${{ github.run_attempt }}-windows
          SECONDS_TO_SERVE: ${{ inputs.seconds }}
        run: |
          ./scripts/capture/capture-run.ps1 -RunId $env:RUN_ID -Out "$env:RUNNER_TEMP/capture" -Observer "$env:GITHUB_WORKSPACE/target/debug/examples/evidence-bundle.exe" -Seconds ([int]$env:SECONDS_TO_SERVE)

      - name: Upload the evidence bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capture-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capture
          if-no-files-found: error
          retention-days: 90

      # ⛔ THIS FINGERPRINT IS NOT A FRESHNESS SIGNAL AND THE SUMMARY MUST NOT
      # SAY IT IS. Measured by CI-06: capture runs 1 and 2 reported the SAME
      # Windows fingerprint on two hosts that were both fresh - run 2's claim
      # succeeded, so the marker run 1 wrote was gone. ⚠ That is structural
      # rather than a defect to patch. A fingerprint must differ between hosts
      # AND survive a reboot within one, and on a cloned image every input with
      # the second property is identical across every clone. ⭐ The claim marker
      # is what detects a survived host, by finding its own marker rather than
      # by comparing anything.
      - name: Report the host fingerprint
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          ./scripts/acquisition/assert-disposable.ps1 -Fingerprint > "$env:RUNNER_TEMP/print"
          $print = (Get-Content -LiteralPath "$env:RUNNER_TEMP/print" -TotalCount 1)
          Write-Output "windows host fingerprint: $print"
          $body = New-Object System.Collections.ArrayList
          [void]$body.Add('### Windows capture')
          [void]$body.Add('')
          [void]$body.Add('host fingerprint `' + $print + '`')
          [void]$body.Add('')
          [void]$body.Add('This identifies the runner IMAGE and not the host: two fresh hosted runners report the same value, which CI-06 measured. The claim step is what refuses a survived host.')
          [void]$body.Add('')
          [void]$body.Add('```')
          $body.AddRange(@(Get-Content -LiteralPath "$env:RUNNER_TEMP/capture/attestation.txt"))
          [void]$body.Add('```')
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $body
