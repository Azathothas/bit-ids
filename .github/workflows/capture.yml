name: Capture

# ⛔ THERE IS NO `pull_request` TRIGGER AND THAT ABSENCE IS THE FORK GUARD.
# A fork cannot cause a workflow to run in the base repository, so there is no
# job-level condition here for anyone to weaken and no `if:` to get subtly
# wrong. The protection is structural. ⚠ An absence is exactly what a later edit
# restores without anybody noticing, which is why scripts/ci/check-workflow.sh
# asserts it as a case rather than this file asserting it as a comment.
#
# ⛔ AND NO `push` OR `schedule` EITHER. This job installs nothing today, but it
# is the file a client installer lands in, and a capture host is a machine whose
# route off itself has been deleted. Neither is something a merge should be able
# to start.
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: How long the observer serves before its own deadline stops it
        required: true
        default: "20"
        type: string

permissions:
  contents: read

# ⛔ NEVER CANCELLED IN FLIGHT, for a sharper reason than the publisher's.
# Between the Windows job's *Cut the route* and *Restore the route* that host
# has no way off itself; the Linux job contains its capture in a namespace and
# never cuts. A cancellation in that window leaves the runner unable to report, the
# evidence unuploaded, and the marker written, so the host is spent and its
# capture is lost. Two dispatches queue instead.
concurrency:
  group: capture
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux capture
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # ⛔ READ ONLY. A capture produces an artifact and never a commit. The
    # publisher is the one job in this repository that may write, and it is a
    # separate workflow a human has to dispatch.
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ⛔ FIRST, BEFORE ANYTHING ELSE WRITES TO THE HOST. The claim refuses a
      # host that already ran a capture, and it can only tell by finding its own
      # marker. A step that ran earlier and left state behind would not be
      # detected; a claim that ran later would be a report rather than a
      # boundary.
      - name: Claim the host
        env:
          RUN_ID: capture-${{ github.run_id }}-${{ github.run_attempt }}-linux
        run: sh scripts/acquisition/assert-disposable.sh --claim "$RUN_ID"

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      # ⛔ THE BUILD HAPPENS HERE, WHILE THE NETWORK STILL EXISTS. After the next
      # step nothing can be fetched, and a capture that discovered a missing
      # crate under containment would have to restore egress to fix it - on a
      # host that exists to have no egress. capture-run.sh refuses to build,
      # so this order is enforced rather than remembered.
      - name: Build the observer
        run: cargo build -p bit-ids-lab --locked --example evidence-bundle

      # ⛔ CONTAINED IN A NETWORK NAMESPACE, NOT BY CUTTING THE HOST'S ROUTE.
      # This job deleted the runner's default routes and restored them after the
      # capture until 2026-10-14. `capture-client` measured on 2026-10-11 that
      # the same cut severs the runner agent from GitHub, which is what ran
      # thirty-two dispatches into the ground; `contained.sh` gives the guard
      # and the capture a namespace with loopback alone, and the host keeps its
      # route throughout. `CI-08`. ⚠ The Windows job below still cuts, because
      # Windows has no namespace to run a process in, and it needs a different
      # containment.
      #
      # ⛔ THE GUARD MUST PASS, AND IT READS THE KERNEL OF THE NAMESPACE THE
      # CAPTURE RUNS IN, which is the routing table that matters.
      - name: Assert containment
        run: sh scripts/capture/contained.sh -- sh scripts/acquisition/assert-disposable.sh --egress

      - name: Capture
        env:
          RUN_ID: capture-${{ github.run_id }}-${{ github.run_attempt }}-linux
          SECONDS_TO_SERVE: ${{ inputs.seconds }}
        run: |
          sh scripts/capture/contained.sh -- sh scripts/capture/capture-run.sh \
            --run-id "$RUN_ID" \
            --out "$RUNNER_TEMP/capture" \
            --observer "$GITHUB_WORKSPACE/target/debug/examples/evidence-bundle" \
            --seconds "$SECONDS_TO_SERVE"

      # ⛔ if-no-files-found IS `error`. An upload that found nothing and exited
      # 0 is the "step that exits 0 having done nothing it was asked to do" row
      # in docs/conventions/forbidden-patterns.md, and it would leave a green
      # capture run with no evidence anywhere.
      - name: Upload the evidence bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capture-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capture
          if-no-files-found: error
          retention-days: 90

      # ⚠ A FINGERPRINT IS COMPARABLE ONLY AGAINST ONE THE SAME HALF PRODUCED.
      # The two guards digest different inputs, so this is compared against the
      # PREVIOUS LINUX capture's, never against the Windows job's below.
      #
      # ⭐ ON LINUX A REPEAT REALLY DOES MEAN A SURVIVED HOST, and CI-06 measured
      # it: capture runs 1 and 2 reported different fingerprints here.
      # ⛔ The Windows job's does NOT, and its own step says so. Read that one.
      - name: Report the host fingerprint
        run: |
          set -eu
          print=$(sh scripts/acquisition/assert-disposable.sh --fingerprint)
          echo "linux host fingerprint: $print"
          {
            echo "### Linux capture"
            echo
            echo "host fingerprint \`$print\`"
            echo
            echo 'Compare against the previous **Linux** run. A repeat means the host was not destroyed.'
            echo
            echo '```'
            cat "$RUNNER_TEMP/capture/attestation.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows capture
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Claim the host
        shell: pwsh
        env:
          RUN_ID: capture-${{ github.run_id }}-${{ github.run_attempt }}-windows
        run: ./scripts/acquisition/assert-disposable.ps1 -Claim -RunId $env:RUN_ID

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup show active-toolchain

      - name: Build the observer
        shell: pwsh
        run: cargo build -p bit-ids-lab --locked --example evidence-bundle

      # ⚠ SAVED AS OBJECTS RATHER THAN AS TEXT. New-NetRoute needs the interface
      # index, the next hop and the metric, and re-parsing them out of a printed
      # table is a second reading of something PowerShell already has typed.
      - name: Cut the route off this host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $saved = @(Get-NetRoute -ErrorAction SilentlyContinue |
            Where-Object { $_.DestinationPrefix -in @('0.0.0.0/0', '::/0') })
          $saved | Export-Clixml -LiteralPath "$env:RUNNER_TEMP/routes.clixml"
          foreach ($route in $saved) {
            Remove-NetRoute -InputObject $route -Confirm:$false
          }
          Write-Output ("saved and removed " + $saved.Count + " default route(s)")

      - name: Assert containment
        shell: pwsh
        run: ./scripts/acquisition/assert-disposable.ps1 -Egress

      # ⭐ AND THIS IS THE ONE THING NO FIXTURE CAN ESTABLISH. check-runner.ps1
      # proves the guard's logic against files of Get-NetRoute output; that the
      # real cmdlet's output matches those fixtures is only ever established by
      # the step above running with no -RouteTable on a real Windows host.
      - name: Capture
        shell: pwsh
        env:
          RUN_ID: capture-${{ github.run_id }}-${{ github.run_attempt }}-windows
          SECONDS_TO_SERVE: ${{ inputs.seconds }}
        run: |
          ./scripts/capture/capture-run.ps1 -RunId $env:RUN_ID -Out "$env:RUNNER_TEMP/capture" -Observer "$env:GITHUB_WORKSPACE/target/debug/examples/evidence-bundle.exe" -Seconds ([int]$env:SECONDS_TO_SERVE)

      # ⛔ THIS STEP IS WHY CI-06 EXISTS. On the first dispatch the restore
      # WORKED and the step failed anyway: the inverted guard below refuses,
      # exit 1 is the proof the route came back, and that 1 was left in
      # $LASTEXITCODE. GitHub's `pwsh` wrapper reads a block's residual code as
      # the step's verdict, so the evidence upload was skipped over a guard that
      # had said exactly what it was asked to say. ⭐ THE STEP'S STATUS IS A
      # DECISION NOW RATHER THAN A RESIDUE: every path ends in an explicit exit.
      # ⚠ The Linux twin never had this, because `if sh ...; then` consumes the
      # status - a convention held on one of the two paths into one mistake.
      - name: Restore the route
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $saved = @(Import-Clixml -LiteralPath "$env:RUNNER_TEMP/routes.clixml")
          # ⛔ AN ADD THAT THROWS IS REPORTED AND DOES NOT END THE STEP, for the
          # reason the Linux job gives: ending here skips the upload and throws
          # away a finished capture over a route. ⭐ The guard below is the
          # verdict; an add is an attempt and the routing table is the fact.
          foreach ($route in $saved) {
            try {
              New-NetRoute -DestinationPrefix $route.DestinationPrefix `
                -InterfaceIndex $route.ifIndex -NextHop $route.NextHop `
                -RouteMetric $route.RouteMetric -PolicyStore ActiveStore `
                -Confirm:$false -ErrorAction Stop | Out-Null
            }
            catch {
              Write-Output ("could not restore: " + $route.DestinationPrefix + " " + $_.Exception.Message)
            }
          }
          ./scripts/acquisition/assert-disposable.ps1 -Egress
          $egress = $LASTEXITCODE
          if ($egress -eq 0) {
            [Console]::Error.WriteLine('the default routes were not restored; the upload cannot work')
            exit 1
          }
          # ⛔ 2 IS `could not run` AND IS NOT THE REFUSAL THIS STEP WANTS. Only
          # a 1 is the guard reading a routing table and finding a public route
          # on it; a 2 means it never got that far, and calling that a restored
          # route would upload from a host nothing established was reachable.
          if ($egress -ne 1) {
            [Console]::Error.WriteLine("the egress guard could not run (exit $egress)")
            exit 1
          }
          exit 0

      - name: Upload the evidence bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capture-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capture
          if-no-files-found: error
          retention-days: 90

      # ⛔ THIS FINGERPRINT IS NOT A FRESHNESS SIGNAL AND THE SUMMARY MUST NOT
      # SAY IT IS. Measured by CI-06: capture runs 1 and 2 reported the SAME
      # Windows fingerprint on two hosts that were both fresh - run 2's claim
      # succeeded, so the marker run 1 wrote was gone. ⚠ That is structural
      # rather than a defect to patch. A fingerprint must differ between hosts
      # AND survive a reboot within one, and on a cloned image every input with
      # the second property is identical across every clone. ⭐ The claim marker
      # is what detects a survived host, by finding its own marker rather than
      # by comparing anything.
      - name: Report the host fingerprint
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          ./scripts/acquisition/assert-disposable.ps1 -Fingerprint > "$env:RUNNER_TEMP/print"
          $print = (Get-Content -LiteralPath "$env:RUNNER_TEMP/print" -TotalCount 1)
          Write-Output "windows host fingerprint: $print"
          $body = New-Object System.Collections.ArrayList
          [void]$body.Add('### Windows capture')
          [void]$body.Add('')
          [void]$body.Add('host fingerprint `' + $print + '`')
          [void]$body.Add('')
          [void]$body.Add('This identifies the runner IMAGE and not the host: two fresh hosted runners report the same value, which CI-06 measured. The claim step is what refuses a survived host.')
          [void]$body.Add('')
          [void]$body.Add('```')
          $body.AddRange(@(Get-Content -LiteralPath "$env:RUNNER_TEMP/capture/attestation.txt"))
          [void]$body.Add('```')
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $body
