# Third-party licence and redistribution register.
#
# FOUND-04 owns this. Every catalogue target and every third-party package has
# a row, and a row records what was MEASURED about it and where that came from.
#
# The disposition is the same for every row and that is the policy rather than
# an oversight: this project publishes measurements, never artifacts. A licence
# that would permit redistribution does not make this repository redistribute.
#
# licence_source says who answered, because the answers are not equally strong:
#   github-api     the repository licence endpoint, whose SPDX id is a detector's
#                  conclusion rather than a reading of the licence text
#   crate-manifest the package's own Cargo.toml license field, at that version
#   catalogue      clients.toml already records the target as closed source
#   none           nobody has asked, so the licence is unverified
#
# unverified is a disposition and not a gap. It means redistribution stays
# refused, which it is anyway, and that nobody may treat the target as
# permissively licensed on this file's authority.
#
# A ROW IS REQUIRED FOR EVERY LOCKED PACKAGE, INCLUDING ONE THAT NEVER BUILDS
# HERE. Cargo.lock lists a package for every target, so a dependency gated to
# another architecture is still something a build could fetch. That is why a
# version bump changes this file: check-licences compares the rows against the
# lockfile in both directions, and a bump that adds packages goes red here until
# somebody records a disposition for each.

schema = "bit-ids/licences/1"
artifact_policy = "measurements-only"

[[targets]]
id = "qbittorrent"
licence = "unverified"
licence_source = "github-api"
redistribute = "refused"
notice = ""

